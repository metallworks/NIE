<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Terra Minima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:        #090d13;
  --ink-2:      #0f151e;
  --plate:      rgba(15, 21, 30, 0.86);
  --plate-solid:#101722;
  --rule:       rgba(226, 214, 190, 0.13);
  --rule-strong:rgba(226, 214, 190, 0.26);
  --parchment:  #ece2ce;
  --muted:      #8d8a7e;
  --muted-cool: #7c8695;
  --brass:      #d7a13c;
  --brass-dim:  #8a6a2c;
  --verdigris:  #4fb9a1;
  --ember:      #d9584a;
  --violet:     #8f7fdd;
  --sky:        #6fa8d6;

  --font-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --font-ui: 'Karla', ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
  --font-data: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --dock-h: 62px;
}

*{ box-sizing: border-box; }
html, body{ height: 100%; }
body{
  margin: 0;
  background: var(--ink);
  color: var(--parchment);
  font-family: var(--font-ui);
  font-size: 14px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button{ font-family: inherit; color: inherit; }
:focus-visible{ outline: 2px solid var(--brass); outline-offset: 2px; }

#app{ position: fixed; inset: 0; }
#stage{ position: absolute; inset: 0; }
#stage canvas{ display: block; touch-action: none; }
#stage.armed{ cursor: crosshair; }

/* ---------- shared plate ---------- */
.plate{
  background: var(--plate);
  border: 1px solid var(--rule);
  border-radius: 12px;
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  box-shadow: 0 10px 34px rgba(0,0,0,0.45);
}
.eyebrow{
  font-family: var(--font-data);
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.num{ font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* ---------- top-left instrument plate ---------- */
#hud{
  position: absolute;
  top: calc(14px + env(safe-area-inset-top, 0px));
  left: 14px;
  padding: 12px 14px 11px;
  display: flex; flex-direction: column; gap: 10px;
  min-width: 232px;
  z-index: 5;
}
#hud .brand{ display: flex; align-items: baseline; gap: 8px; }
#hud h1{
  font-family: var(--font-display);
  font-weight: 700; font-size: 20px; margin: 0;
  letter-spacing: -0.01em; line-height: 1;
}
#hud .brand .epoch{
  font-family: var(--font-data); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--brass);
}
#readouts{
  display: grid; grid-template-columns: repeat(4, minmax(0,1fr));
  gap: 2px 10px;
  border-top: 1px solid var(--rule); padding-top: 9px;
}
.readout{ display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.readout .v{ font-family: var(--font-data); font-size: 16px; font-weight: 500; line-height: 1.05; font-variant-numeric: tabular-nums; }
.readout .k{ font-family: var(--font-data); font-size: 8.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.readout.warlike .v{ color: var(--ember); }

#season-strip{
  display: flex; align-items: center; gap: 8px;
  border-top: 1px solid var(--rule); padding-top: 9px;
}
#season-orb{
  width: 26px; height: 26px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-size: 13px;
  background: rgba(226,214,190,0.07); border: 1px solid var(--rule);
}
#season-text{ display: flex; flex-direction: column; gap: 1px; min-width: 0; }
#season-text .s{ font-size: 12px; font-weight: 500; }
#season-text .t{ font-family: var(--font-data); font-size: 9.5px; color: var(--muted); letter-spacing: 0.06em; }

#energy-wrap{ border-top: 1px solid var(--rule); padding-top: 9px; }
#energy-row{ display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
#energy-row .val{ font-family: var(--font-data); font-size: 10px; color: var(--violet); font-variant-numeric: tabular-nums; }
#energy-bar{ height: 5px; border-radius: 3px; background: rgba(143,127,221,0.16); overflow: hidden; }
#energy-fill{ height: 100%; width: 0%; background: linear-gradient(90deg, #6d5fc0, var(--violet)); transition: width 0.25s linear; }

/* ---------- dock ---------- */
#dock{
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 4px;
  padding: 6px; z-index: 20;
  max-width: calc(100vw - 20px);
}
.dock-btn{
  appearance: none; background: transparent; border: 1px solid transparent;
  border-radius: 9px; cursor: pointer; position: relative;
  width: 52px; height: 48px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
}
.dock-btn .ic{ font-size: 16px; line-height: 1; filter: saturate(0.9); }
.dock-btn .lb{
  font-family: var(--font-data); font-size: 8px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted);
}
.dock-btn:hover{ background: rgba(226,214,190,0.07); }
.dock-btn.on{ background: rgba(215,161,60,0.16); border-color: rgba(215,161,60,0.45); }
.dock-btn.on .lb{ color: var(--brass); }
.dock-btn .badge{
  position: absolute; top: 2px; right: 1px;
  min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px;
  background: var(--ember); color: #1a0705;
  font-family: var(--font-data); font-size: 9px; font-weight: 600;
  display: grid; place-items: center;
}
.dock-sep{ width: 1px; height: 30px; background: var(--rule); margin: 0 5px; flex: none; }

#transport{ display: flex; align-items: center; gap: 4px; }
#play-btn{
  appearance: none; width: 40px; height: 40px; border-radius: 9px; cursor: pointer;
  background: var(--brass); border: 1px solid var(--brass); color: #1d1405;
  font-size: 14px; display: grid; place-items: center;
}
#play-btn:hover{ background: #eab857; }
#play-btn.paused{ background: rgba(226,214,190,0.08); border-color: var(--rule-strong); color: var(--parchment); }
#speed-group{ display: flex; gap: 2px; }
.speed-btn{
  appearance: none; background: transparent; border: 1px solid transparent; cursor: pointer;
  border-radius: 7px; padding: 6px 7px;
  font-family: var(--font-data); font-size: 10.5px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.speed-btn:hover{ background: rgba(226,214,190,0.07); color: var(--parchment); }
.speed-btn.on{ background: rgba(226,214,190,0.12); color: var(--parchment); border-color: var(--rule-strong); }

/* ---------- drawer ---------- */
#drawer{
  position: absolute; left: 50%;
  bottom: calc(var(--dock-h) + 22px + env(safe-area-inset-bottom, 0px));
  width: min(980px, calc(100vw - 24px));
  max-height: min(56vh, 520px);
  transform: translate(-50%, 18px);
  opacity: 0; pointer-events: none;
  display: flex; flex-direction: column;
  z-index: 15;
  transition: opacity 0.18s ease, transform 0.18s cubic-bezier(.2,.9,.3,1);
}
#drawer.open{ opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#drawer{ background: rgba(11, 16, 24, 0.95); }
#drawer-head{
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-bottom: 1px solid var(--rule); flex: none;
}
#drawer-head h2{
  font-family: var(--font-display); font-weight: 700; font-size: 16px; margin: 0; flex: 1;
  letter-spacing: -0.01em;
}
#drawer-head .sub{ font-family: var(--font-data); font-size: 10px; color: var(--muted); letter-spacing: 0.06em; }
.icon-btn{
  appearance: none; background: transparent; border: 1px solid var(--rule); cursor: pointer;
  width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
  color: var(--muted); font-size: 14px; line-height: 1;
}
.icon-btn:hover{ color: var(--parchment); background: rgba(226,214,190,0.07); }
#drawer-body{ overflow-y: auto; padding: 14px; }

/* ---------- panel internals ---------- */
.nation-grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 10px; }
.nation-card{
  border: 1px solid var(--rule); border-radius: 10px; padding: 11px 12px;
  background: rgba(226,214,190,0.025); cursor: pointer;
  display: flex; flex-direction: column; gap: 8px;
  transition: border-color 0.14s ease, background 0.14s ease;
}
.nation-card:hover{ border-color: var(--rule-strong); background: rgba(226,214,190,0.055); }
.nc-top{ display: flex; align-items: center; gap: 8px; }
.swatch{ width: 9px; height: 26px; border-radius: 3px; flex: none; }
.nc-name{ flex: 1; min-width: 0; }
.nc-name .n{ font-family: var(--font-display); font-weight: 700; font-size: 14.5px; line-height: 1.15; display: block;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nc-name .t{ font-family: var(--font-data); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.nc-stats{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.nc-stats .cell .v{ font-family: var(--font-data); font-size: 13px; font-variant-numeric: tabular-nums; }
.nc-stats .cell .k{ font-family: var(--font-data); font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.meter{ height: 4px; border-radius: 2px; background: rgba(226,214,190,0.1); overflow: hidden; }
.meter i{ display: block; height: 100%; }
.chips{ display: flex; flex-wrap: wrap; gap: 4px; }
.chip{
  font-family: var(--font-data); font-size: 9px; letter-spacing: 0.06em;
  padding: 2px 6px; border-radius: 5px; border: 1px solid var(--rule);
  color: var(--muted); display: inline-flex; align-items: center; gap: 4px;
}
.chip.war{ color: var(--ember); border-color: rgba(217,88,74,0.4); background: rgba(217,88,74,0.1); }
.chip.ally{ color: var(--verdigris); border-color: rgba(79,185,161,0.4); background: rgba(79,185,161,0.1); }
.chip.trade{ color: var(--brass); border-color: rgba(215,161,60,0.4); background: rgba(215,161,60,0.1); }

.filter-row{ display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
.filter-btn{
  appearance: none; background: transparent; border: 1px solid var(--rule); cursor: pointer;
  border-radius: 7px; padding: 4px 9px;
  font-family: var(--font-data); font-size: 10px; letter-spacing: 0.06em; color: var(--muted);
}
.filter-btn:hover{ color: var(--parchment); }
.filter-btn.on{ color: var(--parchment); border-color: var(--rule-strong); background: rgba(226,214,190,0.09); }

#chronicle-list{ display: flex; flex-direction: column; gap: 1px; }
.chron{
  display: grid; grid-template-columns: 30px 52px 1fr; align-items: baseline; gap: 10px;
  padding: 7px 8px; border-radius: 7px; line-height: 1.45; font-size: 13px;
}
.chron:nth-child(odd){ background: rgba(226,214,190,0.028); }
.chron .ic{ font-size: 14px; line-height: 1.2; text-align: center; }
.chron .d{ font-family: var(--font-data); font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }
.chron b{ font-weight: 700; }
.chron.war b{ color: var(--ember); }
.chron.peace b, .chron.found b{ color: var(--verdigris); }
.chron.boon b{ color: var(--brass); }
.chron.disaster b{ color: var(--ember); }
.chron.tech b{ color: var(--violet); }
.chron.divine b{ color: var(--violet); }
.chron .txt{ color: #cfc7b6; }

.map-wrap{ display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
#minimap{ width: 100%; border-radius: 8px; display: block; border: 1px solid var(--rule); background: #06090e; }
.terrain-key{ display: flex; flex-direction: column; gap: 7px; }
.key-row{ display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #cfc7b6; }
.key-dot{ width: 11px; height: 11px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,0.35); }

.chart-block{ margin-bottom: 18px; }
.chart-head{ display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.chart-head h3{ font-family: var(--font-display); font-weight: 700; font-size: 13.5px; margin: 0; }
.chart-canvas{ width: 100%; display: block; }
.chart-legend{ display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 8px; }
.chart-legend .li{ display: flex; align-items: center; gap: 6px; font-size: 12px; color: #cfc7b6; }
.chart-legend .li i{ width: 14px; height: 2.5px; border-radius: 2px; display: block; }

.power-grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 9px; }
.power{
  appearance: none; text-align: left; cursor: pointer;
  border: 1px solid var(--rule); border-radius: 10px; padding: 10px 11px;
  background: rgba(143,127,221,0.04);
  display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start;
  transition: border-color 0.14s ease, background 0.14s ease, opacity 0.14s ease;
}
.power:hover{ border-color: rgba(143,127,221,0.5); background: rgba(143,127,221,0.1); }
.power.on{ border-color: var(--violet); background: rgba(143,127,221,0.18); }
.power:disabled{ opacity: 0.38; cursor: not-allowed; }
.power .pi{ font-size: 19px; line-height: 1; padding-top: 1px; }
.power .pn{ font-family: var(--font-display); font-weight: 700; font-size: 13.5px; display: block; }
.power .pd{ font-size: 11.5px; color: var(--muted); line-height: 1.35; display: block; margin-top: 2px; }
.power .pc{ font-family: var(--font-data); font-size: 9.5px; color: var(--violet); letter-spacing: 0.08em; display: block; margin-top: 5px; }

.opt-row{
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 9px 2px; border-bottom: 1px solid var(--rule);
}
.opt-row:last-child{ border-bottom: 0; }
.opt-row .lbl .t{ font-size: 13px; display: block; }
.opt-row .lbl .d{ font-size: 11.5px; color: var(--muted); display: block; margin-top: 1px; }
.toggle{
  appearance: none; cursor: pointer; flex: none;
  width: 40px; height: 22px; border-radius: 11px;
  border: 1px solid var(--rule-strong); background: rgba(226,214,190,0.07);
  position: relative; transition: background 0.16s ease, border-color 0.16s ease;
}
.toggle::after{
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%; background: var(--muted);
  transition: transform 0.16s cubic-bezier(.2,.9,.3,1), background 0.16s ease;
}
.toggle.on{ background: rgba(215,161,60,0.3); border-color: var(--brass); }
.toggle.on::after{ transform: translateX(18px); background: var(--brass); }

.help-cols{ display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
.help-cols h3{ font-family: var(--font-display); font-size: 13px; font-weight: 700; margin: 0 0 8px; }
.help-cols dl{ margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: baseline; }
.help-cols dt{ font-family: var(--font-data); font-size: 10px; color: var(--brass); letter-spacing: 0.04em; white-space: nowrap; }
.help-cols dd{ margin: 0; font-size: 12.5px; color: #cfc7b6; line-height: 1.4; }
.era-track{ display: flex; flex-direction: column; gap: 6px; }
.era-step{ display: grid; grid-template-columns: 22px 1fr auto; gap: 9px; align-items: baseline; font-size: 12.5px; }
.era-step .n{ font-family: var(--font-data); font-size: 10px; color: var(--muted); }
.era-step .r{ font-family: var(--font-data); font-size: 10px; color: var(--muted); }

/* ---------- inspector ---------- */
#inspector{
  position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px;
  width: 268px; padding: 13px 14px; z-index: 10;
  display: none; flex-direction: column; gap: 10px;
  max-height: calc(100% - 120px); overflow-y: auto;
}
#inspector.show{ display: flex; }
#insp-head{ display: flex; align-items: flex-start; gap: 9px; }
#insp-head .swatch{ height: 32px; }
#insp-title{ font-family: var(--font-display); font-weight: 700; font-size: 16.5px; margin: 0; line-height: 1.15; flex: 1; }
#insp-sub{ font-family: var(--font-data); font-size: 9.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); display: block; margin-top: 2px; }
.insp-rows{ display: flex; flex-direction: column; gap: 0; }
.irow{ display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px solid var(--rule); font-size: 12.5px; }
.irow:last-child{ border-bottom: 0; }
.irow .k{ color: var(--muted); flex: none; }
.irow .v{ text-align: right; font-family: var(--font-data); font-size: 12px; font-variant-numeric: tabular-nums; word-break: break-word; }
.stock-grid{ display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.stock{ text-align: center; border: 1px solid var(--rule); border-radius: 7px; padding: 5px 2px; }
.stock .i{ font-size: 12px; line-height: 1.2; }
.stock .v{ font-family: var(--font-data); font-size: 11px; font-variant-numeric: tabular-nums; display: block; margin-top: 1px; }
#insp-note{ font-size: 11.5px; color: var(--muted); line-height: 1.4; font-style: italic; }
#insp-focus{
  appearance: none; cursor: pointer; width: 100%;
  border: 1px solid var(--rule-strong); background: rgba(226,214,190,0.06);
  border-radius: 8px; padding: 7px; font-size: 12px;
}
#insp-focus:hover{ background: rgba(226,214,190,0.12); }

/* ---------- event toasts ---------- */
#toasts{
  position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 8px; align-items: center;
  z-index: 30; pointer-events: none; width: min(430px, calc(100vw - 40px));
}
.toast{
  width: 100%;
  display: grid; grid-template-columns: 38px 1fr; gap: 11px; align-items: center;
  padding: 10px 13px 10px 11px;
  border-left: 3px solid var(--brass);
  animation: toast-in 0.34s cubic-bezier(.16,1.1,.3,1) both;
}
.toast.leaving{ animation: toast-out 0.3s ease forwards; }
@keyframes toast-in{
  from{ opacity: 0; transform: translateY(-14px) scale(0.96); }
  to{ opacity: 1; transform: none; }
}
@keyframes toast-out{
  to{ opacity: 0; transform: translateY(-10px) scale(0.97); }
}
.toast .ic{
  width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
  font-size: 19px; background: rgba(226,214,190,0.07);
  animation: ic-pop 0.5s cubic-bezier(.2,1.5,.4,1) both;
}
@keyframes ic-pop{ from{ transform: scale(0.4) rotate(-14deg); } to{ transform: none; } }
.toast .tt{ font-family: var(--font-display); font-weight: 700; font-size: 13.5px; line-height: 1.2; }
.toast .td{ font-size: 12px; color: #c6bdab; line-height: 1.35; margin-top: 2px; }
.toast .td b{ color: var(--parchment); font-weight: 700; }

#flash{
  position: absolute; inset: 0; pointer-events: none; z-index: 25; opacity: 0;
  box-shadow: inset 0 0 160px 30px currentColor;
  color: var(--ember);
}
#flash.go{ animation: flash-k 0.75s ease-out; }
@keyframes flash-k{ 0%{ opacity: 0; } 14%{ opacity: 0.85; } 100%{ opacity: 0; } }

/* ---------- armed banner ---------- */
#armed{
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--dock-h) + 24px + env(safe-area-inset-bottom, 0px));
  display: none; align-items: center; gap: 10px;
  padding: 9px 14px; z-index: 18;
  border-color: rgba(143,127,221,0.5);
  background: rgba(24, 20, 42, 0.9);
}
#armed.show{ display: flex; }
#armed .ic{ font-size: 17px; }
#armed .tx{ font-size: 12.5px; }
#armed .tx b{ font-family: var(--font-display); }
#armed .esc{ font-family: var(--font-data); font-size: 9.5px; color: var(--muted); letter-spacing: 0.08em; }

#hint{
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--dock-h) + 24px + env(safe-area-inset-bottom, 0px));
  font-family: var(--font-data); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted);
  pointer-events: none; z-index: 8; white-space: nowrap;
  transition: opacity 0.4s ease;
}

.empty{ color: var(--muted); font-size: 12.5px; font-style: italic; padding: 8px 2px; }

::-webkit-scrollbar{ width: 7px; height: 7px; }
::-webkit-scrollbar-thumb{ background: rgba(226,214,190,0.16); border-radius: 4px; }
::-webkit-scrollbar-track{ background: transparent; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

@media (max-width: 860px){
  .map-wrap{ grid-template-columns: 1fr; }
  #inspector{ width: 220px; }
}
@media (max-width: 640px){

};
const BUILD_ORDER = ['farm','camp','hut','granary','house','harbour','mine','quarry','shrine','market','windmill','workshop','barracks','library','forge','aqueduct','amphi','fortress','tower','observatory','university','wonder'];

const RESOURCE_LABEL = { farmland:'Farmland', forest:'Woodland', plain:'Open plain', rock:'Bare rock', ore:'Ore seam', reeds:'Reed beds' };

/* ============================ STATE ============================ */
let scene, camera, renderer, raycaster;
let terrainMesh, terrainGeo, vertHeights, tiles;
let sunLight, fillLight, ambient, skyDome, starField, sunOrb;
let nations = [], nationsById = new Map();
let agents = [], armies = [];
let nextNationId = 1, nextAgentId = 1, nextArmyId = 1;
let seed = Math.random() * 1000;

let paused = false;
let speedMult = 1;
let tickAccum = 0, tickProgress = 0;
let lastFrameTime = performance.now();
let day = 0;
let terrainDirty = false;
let usedNames = new Set();
let buildingCount = 0;
let favour = MAX_FAVOUR;
let armedPower = null;
let worldEventCooldown = 26 + Math.floor(Math.random() * 18);
let historySamples = [];
let seasonIndex = 0;

const chronicle = [];
const groundRings = [];
const floatIcons = [];
const pings = [];
const decorMeshes = [];
const tradeLines = [];
const spinners = [];
let shake = 0;

const options = {
  buildings: true,
  armies: true,
  decor: true,
  toasts: true,
  dayNight: true,
  seasons: true,
  autoOrbit: false
};

const cam = { radius: GRID * 0.86, polar: 0.92, azimuth: Math.PI * 0.25, target: null };
let dragging = false, lastPX = 0, lastPY = 0, clickStartX = 0, clickStartY = 0;

/* ============================ NOISE ============================ */
function hash(x, y, s){
  const h = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453123;
  return h - Math.floor(h);
}
function smoothNoise(x, y, s){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi, s), b = hash(xi + 1, yi, s);
  const c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s){
  let total = 0, amp = 0.5, freq = 1, max = 0;
  for(let i = 0; i < 5; i++){
    total += smoothNoise(x * freq, y * freq, s) * amp;
    max += amp; amp *= 0.5; freq *= 2;
  }
  return total / max;
}

/* ============================ HELPERS ============================ */
function key(cx, cz){ return cx + ',' + cz; }
function parseKey(k){ const i = k.indexOf(','); return [ +k.slice(0, i), +k.slice(i + 1) ]; }
function cellX(cx){ return (cx - GRID / 2 + 0.5) * TILE; }
function cellZ(cz){ return (cz - GRID / 2 + 0.5) * TILE; }
function inBounds(cx, cz){ return cx >= 0 && cx < GRID && cz >= 0 && cz < GRID; }
function isLand(cx, cz){ return inBounds(cx, cz) && tiles[cz][cx].type !== 'water'; }
function isCoastal(cx, cz){
  if(!isLand(cx, cz)) return false;
  for(const [nx, nz] of neighborsOf(cx, cz)) if(!isLand(nx, nz)) return true;
  return false;
}
function neighborsOf(cx, cz){ return [[cx + 1, cz], [cx - 1, cz], [cx, cz + 1], [cx, cz - 1]]; }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function fmt(n){ return Math.round(n).toLocaleString(); }
function season(){ return SEASONS[seasonIndex]; }
function dayPhase(){ return options.dayNight ? ((day % DAY_LENGTH) + tickProgress) / DAY_LENGTH : 0.5; }
function clockWord(){
  const p = dayPhase();
  if(!options.dayNight) return 'midday';
  if(p < 0.14 || p > 0.88) return 'deep night';
  if(p < 0.32) return 'dawn';
  if(p < 0.62) return 'midday';
  if(p < 0.8) return 'evening';
  return 'nightfall';
}

/* ============================ THREE SETUP ============================ */
function initThree(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x090d13);
  scene.fog = new THREE.Fog(0x090d13, GRID * 0.72, GRID * 1.8);

  const stage = document.getElementById('stage');
  camera = new THREE.PerspectiveCamera(46, stage.clientWidth / stage.clientHeight, 0.1, 600);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  stage.appendChild(renderer.domElement);

  ambient = new THREE.AmbientLight(0x93a6c6, 0.62);
  scene.add(ambient);
  sunLight = new THREE.DirectionalLight(0xfff0d4, 1.05);
  sunLight.position.set(GRID * 0.6, GRID * 0.9, GRID * 0.3);
  scene.add(sunLight);
  fillLight = new THREE.DirectionalLight(0x4d6fa8, 0.34);
  fillLight.position.set(-GRID * 0.5, GRID * 0.4, -GRID * 0.4);
  scene.add(fillLight);

  sunOrb = new THREE.Mesh(
    new THREE.SphereGeometry(1.5, 14, 12),
    new THREE.MeshBasicMaterial({ color: 0xffe9b0 })
  );
  scene.add(sunOrb);

  buildStars();

  raycaster = new THREE.Raycaster();
  cam.target = new THREE.Vector3(0, 1.1, 0);
  updateCamera();

  window.addEventListener('resize', onResize);
  setupPointer();
}

function buildStars(){
  const g = new THREE.BufferGeometry();
  const pts = [];
  for(let i = 0; i < 600; i++){
    const r = GRID * 2.2;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 0.9 + 0.05);
    pts.push(r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph) * 0.8 + 6, r * Math.sin(ph) * Math.sin(th));
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  starField = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xdfe8f5, size: 0.35, transparent: true, opacity: 0 }));
  scene.add(starField);
}

function onResize(){
  const stage = document.getElementById('stage');
  camera.aspect = stage.clientWidth / stage.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(stage.clientWidth, stage.clientHeight);
}

function updateCamera(){
  const r = cam.radius, p = cam.polar, a = cam.azimuth;
  camera.position.set(
    cam.target.x + r * Math.sin(p) * Math.sin(a) + (Math.random() - 0.5) * shake,
    cam.target.y + r * Math.cos(p) + (Math.random() - 0.5) * shake,
    cam.target.z + r * Math.sin(p) * Math.cos(a) + (Math.random() - 0.5) * shake
  );
  camera.lookAt(cam.target);
}

function setupPointer(){
  const dom = renderer.domElement;
  dom.addEventListener('pointerdown', (e) => {
    dragging = true; lastPX = e.clientX; lastPY = e.clientY;
    clickStartX = e.clientX; clickStartY = e.clientY;
    try { dom.setPointerCapture(e.pointerId); } catch(err){}
  });
  dom.addEventListener('pointerup', () => { dragging = false; });
  dom.addEventListener('pointercancel', () => { dragging = false; });
  dom.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    const dx = e.clientX - lastPX, dy = e.clientY - lastPY;
    lastPX = e.clientX; lastPY = e.clientY;
    cam.azimuth -= dx * 0.0055;
    cam.polar = clamp(cam.polar - dy * 0.0045, 0.22, 1.46);
    updateCamera();
  });
  dom.addEventListener('wheel', (e) => {
    e.preventDefault();
    cam.radius = clamp(cam.radius + e.deltaY * 0.022, GRID * 0.24, GRID * 1.35);
    updateCamera();
  }, { passive: false });
  dom.addEventListener('click', (e) => {
    if(Math.abs(e.clientX - clickStartX) > 4 || Math.abs(e.clientY - clickStartY) > 4) return;
    handleWorldClick(e);
  });
}

function cellFromEvent(e){
  const stage = document.getElementById('stage');
  const rect = stage.getBoundingClientRect();
  const m = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  raycaster.setFromCamera(m, camera);
  const hits = raycaster.intersectObject(terrainMesh);
  if(!hits.length) return null;
  const p = hits[0].point;
  return {
    cx: clamp(Math.floor(p.x / TILE + GRID / 2), 0, GRID - 1),
    cz: clamp(Math.floor(p.z / TILE + GRID / 2), 0, GRID - 1)
  };
}

/* ============================ WORLD GENERATION ============================ */
function generateWorldData(){
  seed = Math.random() * 1000;
  tiles = [];
  for(let cz = 0; cz < GRID; cz++){
    const row = [];
    for(let cx = 0; cx < GRID; cx++){
      row.push({ cx, cz, hRaw: 0, y: 0, type: 'land', resource: null, owner: null, building: null, buildingMesh: null, fertility: 1 });
    }
    tiles.push(row);
  }

  vertHeights = [];
  for(let gz = 0; gz <= GRID; gz++){
    const row = [];
    for(let gx = 0; gx <= GRID; gx++){
      let h = fbm(gx / GRID * 2.5, gz / GRID * 2.5, seed);
      // pull the edges down so the world reads as an island, not a cropped plane
      const ex = Math.min(gx, GRID - gx) / (GRID * 0.5);
      const ez = Math.min(gz, GRID - gz) / (GRID * 0.5);
      const edge = Math.min(1, Math.min(ex, ez) * 2.1);
      h = h * (0.30 + 0.70 * edge);
      row.push(h);
    }
    vertHeights.push(row);
  }

  for(let cz = 0; cz < GRID; cz++){
    for(let cx = 0; cx < GRID; cx++) recomputeTile(cx, cz, true);
  }
}

function recomputeTile(cx, cz, assignResource){
  const t = tiles[cz][cx];
  const h = (vertHeights[cz][cx] + vertHeights[cz + 1][cx] + vertHeights[cz][cx + 1] + vertHeights[cz + 1][cx + 1]) / 4;
  t.hRaw = h;
  t.y = h * HEIGHT_SCALE;
  const prevType = t.type;
  t.type = h < WATER_LEVEL ? 'water' : (h < MOUNTAIN_LEVEL ? 'land' : 'mountain');
  if(assignResource || prevType !== t.type){
    if(t.type === 'land'){
      const r = Math.random();
      const coastal = touchesWater(cx, cz);
      t.resource = coastal && r < 0.18 ? 'reeds' : (r < 0.34 ? 'forest' : (r < 0.64 ? 'farmland' : 'plain'));
    } else if(t.type === 'mountain'){
      t.resource = Math.random() < 0.3 ? 'ore' : 'rock';
    } else {
      t.resource = null;
    }
  }
}

function touchesWater(cx, cz){
  for(const [nx, nz] of neighborsOf(cx, cz)){
    if(inBounds(nx, nz) && (vertHeights[nz][nx] + vertHeights[nz + 1][nx + 1]) / 2 < WATER_LEVEL) return true;
  }
  return false;
}

/* ============================ TERRAIN COLOUR ============================ */
const C_DEEP = new THREE.Color(0x0a1f33), C_SHALLOW = new THREE.Color(0x2a76a0);
const C_LOW = new THREE.Color(0x3c6b39), C_HIGH = new THREE.Color(0x8b7c4c);
const C_ROCK = new THREE.Color(0x857f78), C_SNOW = new THREE.Color(0xeef1f4);
let seasonColor = new THREE.Color(0x67b04a);

function cellBaseColor(t){
  let c;
  if(t.type === 'water'){
    c = C_DEEP.clone().lerp(C_SHALLOW, clamp(t.hRaw / WATER_LEVEL, 0, 1));
  } else if(t.type === 'land'){
    const k = clamp((t.hRaw - WATER_LEVEL) / (MOUNTAIN_LEVEL - WATER_LEVEL), 0, 1);
    c = C_LOW.clone().lerp(C_HIGH, k);
    if(t.resource === 'forest') c.lerp(new THREE.Color(0x2f5730), 0.35);
    if(t.resource === 'farmland') c.lerp(new THREE.Color(0x7d9440), 0.25);
    if(options.seasons) c.lerp(seasonColor, season().tintAmt);
  } else {
    const k = clamp((t.hRaw - MOUNTAIN_LEVEL) / (1 - MOUNTAIN_LEVEL), 0, 1);
    c = C_ROCK.clone().lerp(C_SNOW, k);
    if(options.seasons && seasonIndex === 3) c.lerp(C_SNOW, 0.35);
  }
  return c;
}

let colorCache = null;
function cellColor(cx, cz){
  const idx = cz * GRID + cx;
  let cached = colorCache[idx];
  if(cached) return cached;
  const t = tiles[cz][cx];
  let c = cellBaseColor(t);
  if(t.owner){
    const n = nationsById.get(t.owner);
    if(n){
      let border = false;
      for(const [nx, nz] of neighborsOf(cx, cz)){
        if(!inBounds(nx, nz) || tiles[nz][nx].owner !== t.owner){ border = true; break; }
      }
      c = c.lerp(n.color, border ? 0.68 : 0.36);
    }
  }
  colorCache[idx] = c;
  return c;
}

function updateTerrainColors(){
  const attr = terrainGeo.attributes.color;
  colorCache = new Array(GRID * GRID);
  for(let gz = 0; gz <= GRID; gz++){
    for(let gx = 0; gx <= GRID; gx++){
      let r = 0, g = 0, b = 0, n = 0;
      for(const [ncx, ncz] of [[gx - 1, gz - 1], [gx, gz - 1], [gx - 1, gz], [gx, gz]]){
        if(inBounds(ncx, ncz)){ const c = cellColor(ncx, ncz); r += c.r; g += c.g; b += c.b; n++; }
      }
      if(!n) n = 1;
      const i = (gz * (GRID + 1) + gx) * 3;
      attr.array[i] = r / n; attr.array[i + 1] = g / n; attr.array[i + 2] = b / n;
    }
  }
  attr.needsUpdate = true;
  colorCache = null;
}

let waterVerts = [];
function buildTerrainMesh(){
  if(terrainMesh){
    scene.remove(terrainMesh);
    terrainGeo.dispose();
    terrainMesh.material.dispose();
  }
  const positions = [], colors = [], indices = [];
  for(let gz = 0; gz <= GRID; gz++){
    for(let gx = 0; gx <= GRID; gx++){
      positions.push((gx - GRID / 2) * TILE, vertHeights[gz][gx] * HEIGHT_SCALE, (gz - GRID / 2) * TILE);
      colors.push(0.5, 0.5, 0.5);
    }
  }
  for(let gz = 0; gz < GRID; gz++){
    for(let gx = 0; gx < GRID; gx++){
      const a = gz * (GRID + 1) + gx, b = a + 1, c = a + (GRID + 1), d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }
  terrainGeo = new THREE.BufferGeometry();
  terrainGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  terrainGeo.setIndex(indices);
  terrainGeo.computeVertexNormals();

  terrainMesh = new THREE.Mesh(terrainGeo, new THREE.MeshLambertMaterial({ vertexColors: true }));
  scene.add(terrainMesh);
  cacheWaterVerts();
  updateTerrainColors();
}

function cacheWaterVerts(){
  waterVerts = [];
  for(let gz = 0; gz <= GRID; gz++){
    for(let gx = 0; gx <= GRID; gx++){
      if(vertHeights[gz][gx] < WATER_LEVEL - 0.01){
        const i = gz * (GRID + 1) + gx;
        waterVerts.push({ i, base: vertHeights[gz][gx] * HEIGHT_SCALE, ph: (gx * 0.7 + gz * 1.1) });
      }
    }
  }
}

function animateWater(t){
  if(!terrainGeo) return;
  const arr = terrainGeo.attributes.position.array;
  for(let k = 0; k < waterVerts.length; k++){
    const w = waterVerts[k];
    arr[w.i * 3 + 1] = w.base + Math.sin(t * 1.4 + w.ph) * 0.035;
  }
  terrainGeo.attributes.position.needsUpdate = true;
}

/* ============================ TERRAIN RESHAPING (divine) ============================ */
function reshapeTerrain(cx, cz, delta, radius){
  for(let gz = Math.max(0, cz - radius); gz <= Math.min(GRID, cz + radius + 1); gz++){
    for(let gx = Math.max(0, cx - radius); gx <= Math.min(GRID, cx + radius + 1); gx++){
      const d = Math.hypot(gx - (cx + 0.5), gz - (cz + 0.5));
      if(d > radius + 0.6) continue;
      const fall = Math.pow(Math.max(0, 1 - d / (radius + 0.6)), 1.6);
      vertHeights[gz][gx] = clamp(vertHeights[gz][gx] + delta * fall, 0.02, 0.99);
    }
  }
  const arr = terrainGeo.attributes.position.array;
  for(let gz = Math.max(0, cz - radius - 1); gz <= Math.min(GRID, cz + radius + 2); gz++){
    for(let gx = Math.max(0, cx - radius - 1); gx <= Math.min(GRID, cx + radius + 2); gx++){
      arr[(gz * (GRID + 1) + gx) * 3 + 1] = vertHeights[gz][gx] * HEIGHT_SCALE;
    }
  }
  for(let tz = Math.max(0, cz - radius - 1); tz <= Math.min(GRID - 1, cz + radius + 1); tz++){
    for(let tx = Math.max(0, cx - radius - 1); tx <= Math.min(GRID - 1, cx + radius + 1); tx++){
      recomputeTile(tx, tz, false);
      const t = tiles[tz][tx];
      if(t.type === 'water'){
        if(t.buildingMesh){ disposeObj(t.buildingMesh); t.buildingMesh = null; t.building = null; buildingCount--; }
        if(t.owner){
          const n = nationsById.get(t.owner);
          if(n){ n.tiles.delete(key(tx, tz)); if(!n.tiles.size) eliminateNation(n, 'swallowed by the sea'); }
          t.owner = null;
        }
      }
      if(t.buildingMesh) t.buildingMesh.position.y = t.y;
    }
  }
  for(const a of agents){
    if(Math.abs(a.cx - cx) <= radius + 1 && Math.abs(a.cz - cz) <= radius + 1){
      a.prevY = a.nextY = tiles[a.cz][a.cx].y;
      if(!isLand(a.cx, a.cz)) relocateToLand(a);
    }
  }
  for(const d of decorMeshes){
    if(Math.abs(d.userData.cx - cx) <= radius + 1 && Math.abs(d.userData.cz - cz) <= radius + 1){
      const t = tiles[d.userData.cz][d.userData.cx];
      d.visible = t.type !== 'water';
      d.position.y = t.y + d.userData.yOff;
    }
  }
  for(const n of nations){
    if(n.eliminated || !n.capitalMesh) continue;
    const t = tiles[n.capital.cz][n.capital.cx];
    n.capitalMesh.position.y = t.y;
  }
  terrainGeo.computeVertexNormals();
  terrainGeo.attributes.position.needsUpdate = true;
  cacheWaterVerts();
  terrainDirty = true;
}

function relocateToLand(agent){
  for(let r = 1; r < 6; r++){
    for(let dz = -r; dz <= r; dz++){
      for(let dx = -r; dx <= r; dx++){
        const nx = agent.cx + dx, nz = agent.cz + dz;
        if(isLand(nx, nz)){
          agent.cx = nx; agent.cz = nz;
          agent.prevX = agent.nextX = cellX(nx);
          agent.prevZ = agent.nextZ = cellZ(nz);
          agent.prevY = agent.nextY = tiles[nz][nx].y;
          return;
        }
      }
    }
  }
}

/* ============================ DECOR ============================ */
let decorMats = null;
let decorGeos = [];
function buildDecorations(){
  for(const d of decorMeshes){ scene.remove(d); }
  decorMeshes.length = 0;
  for(const g of decorGeos) g.dispose();
  decorGeos = [];
  if(!decorMats){
    decorMats = {
      leaf: new THREE.MeshLambertMaterial({ color: 0x3a6b33 }),
      leafDark: new THREE.MeshLambertMaterial({ color: 0x2c5730 }),
      trunk: new THREE.MeshLambertMaterial({ color: 0x584028 }),
      crystal: new THREE.MeshLambertMaterial({ color: 0x86c0dc }),
      reed: new THREE.MeshLambertMaterial({ color: 0x8aa04c }),
      rock: new THREE.MeshLambertMaterial({ color: 0x77726b })
    };
  }
  const geoTrunk = new THREE.CylinderGeometry(0.025, 0.035, 0.16, 5);
  const geoLeaf = new THREE.ConeGeometry(0.14, 0.34, 6);
  const geoCrystal = new THREE.ConeGeometry(0.075, 0.24, 4);
  const geoReed = new THREE.ConeGeometry(0.05, 0.26, 4);
  const geoRock = new THREE.DodecahedronGeometry(0.1, 0);
  decorGeos = [geoTrunk, geoLeaf, geoCrystal, geoReed, geoRock];

  function add(geo, mat, cx, cz, yOff, jx, jz, rot){
    const m = new THREE.Mesh(geo, mat);
    m.position.set(cellX(cx) + jx, tiles[cz][cx].y + yOff, cellZ(cz) + jz);
    if(rot) m.rotation.y = rot;
    m.userData = { cx, cz, yOff };
    scene.add(m); decorMeshes.push(m);
  }

  for(let cz = 0; cz < GRID; cz++){
    for(let cx = 0; cx < GRID; cx++){
      const t = tiles[cz][cx];
      const jx = (Math.random() - 0.5) * 0.4, jz = (Math.random() - 0.5) * 0.4;
      if(t.resource === 'forest' && Math.random() < 0.55){
        add(geoTrunk, decorMats.trunk, cx, cz, 0.08, jx, jz);
        add(geoLeaf, Math.random() < 0.5 ? decorMats.leaf : decorMats.leafDark, cx, cz, 0.3, jx, jz);
      } else if(t.resource === 'ore' && Math.random() < 0.4){
        add(geoCrystal, decorMats.crystal, cx, cz, 0.12, jx, jz, Math.random() * Math.PI);
      } else if(t.resource === 'reeds' && Math.random() < 0.6){
        add(geoReed, decorMats.reed, cx, cz, 0.13, jx, jz, Math.random() * Math.PI);
      } else if(t.resource === 'rock' && Math.random() < 0.25){
        add(geoRock, decorMats.rock, cx, cz, 0.05, jx, jz, Math.random() * Math.PI);
      }
    }
  }
  applyDecorVisibility();
}
function applyDecorVisibility(){
  for(const d of decorMeshes) d.visible = options.decor && tiles[d.userData.cz][d.userData.cx].type !== 'water';
}

function disposeObj(obj){
  if(!obj) return;
  scene.remove(obj);
  obj.traverse(o => {
    if(o.geometry) o.geometry.dispose();
    if(o.material){
      if(Array.isArray(o.material)) o.material.forEach(m => m.dispose());
      else o.material.dispose();
    }
  });
}

/* ============================ NAMES & COLOURS ============================ */
function makeNationName(){
  for(let i = 0; i < 40; i++){
    const n = pick(NAME_PREFIX) + pick(NAME_SUFFIX);
    if(!usedNames.has(n)){ usedNames.add(n); return n; }
  }
  return 'State ' + nextNationId;
}
function makeNationColor(i){
  const c = new THREE.Color();
  c.setHSL(((i * 137.508) % 360) / 360, 0.56, 0.52);
  return c;
}

/* ============================ ATMOSPHERE ============================ */
const DAY_SKY = new THREE.Color(0x2b4670);
const NIGHT_SKY = new THREE.Color(0x0b1220);
const DUSK_SKY = new THREE.Color(0x2a2233);

function updateAtmosphere(t){
  const phase = dayPhase();
  const angle = phase * Math.PI * 2 - Math.PI / 2;
  const elev = Math.sin(angle);
  // the world never goes fully dark — night is a cool blue wash, not a blackout
  const lightness = clamp((elev + 0.62) / 1.35, 0.26, 1);

  sunLight.position.set(Math.cos(angle) * GRID * 0.9, Math.max(elev, -0.1) * GRID * 0.95 + 8, GRID * 0.35);
  sunLight.intensity = 0.3 + lightness * 0.8;
  sunLight.color.setHSL(0.10, 0.42 - lightness * 0.26, 0.5 + lightness * 0.3);
  ambient.intensity = 0.38 + lightness * 0.2;
  ambient.color.setRGB(0.46 + lightness * 0.2, 0.52 + lightness * 0.16, 0.7 + lightness * 0.08);
  fillLight.intensity = 0.18 + (1 - lightness) * 0.22;

  sunOrb.position.copy(sunLight.position).multiplyScalar(1.15);
  sunOrb.visible = elev > -0.15;
  sunOrb.material.color.setHSL(0.10, 0.6, 0.6 + lightness * 0.3);

  const dusk = 1 - Math.abs(lightness - 0.5) * 2;
  const skyC = NIGHT_SKY.clone().lerp(DAY_SKY, lightness).lerp(DUSK_SKY, dusk * 0.35);
  scene.background.copy(skyC);
  scene.fog.color.copy(skyC);
  starField.material.opacity = clamp(1 - (lightness - 0.26) * 3.4, 0, 0.8);
  starField.rotation.y = t * 0.006;
}

function updateSeason(){
  const idx = Math.floor(day / DAYS_PER_SEASON) % 4;
  if(idx !== seasonIndex){
    seasonIndex = idx;
    seasonColor = new THREE.Color(season().tint);
    terrainDirty = true;
    return true;
  }
  return false;
}

/* ==================================================================
   Part 2 of 3: peoples, states, economies, armies, history
   ================================================================== */

/* ============================ AGENTS ============================ */
const AGENT_GEO = { citizen: null };
function agentGeos(){
  if(!AGENT_GEO.citizen) AGENT_GEO.citizen = new THREE.ConeGeometry(0.16, 0.44, 6);
  return AGENT_GEO;
}

function spawnAgent(cx, cz, nationId){
  if(agents.length >= MAX_AGENTS || !isLand(cx, cz)) return null;
  const n = nationId ? nationsById.get(nationId) : null;
  const mesh = new THREE.Mesh(agentGeos().citizen, new THREE.MeshLambertMaterial({ color: n ? n.color.clone() : new THREE.Color(0x9aa5b8) }));
  const wx = cellX(cx), wz = cellZ(cz), wy = tiles[cz][cx].y;
  mesh.position.set(wx, wy + 0.22, wz);
  scene.add(mesh);
  const a = {
    id: nextAgentId++, cx, cz, nationId: nationId || null,
    prevX: wx, prevZ: wz, prevY: wy, nextX: wx, nextZ: wz, nextY: wy,
    mesh, bob: Math.random() * 6
  };
  agents.push(a);
  return a;
}

function removeAgent(agent){
  scene.remove(agent.mesh);
  agent.mesh.material.dispose();
  const i = agents.indexOf(agent);
  if(i >= 0) agents.splice(i, 1);
}

function citizensOf(nationId){ return agents.filter(a => a.nationId === nationId); }

function killCitizens(nation, count){
  let lost = 0;
  const pool = citizensOf(nation.id);
  for(let i = 0; i < count && pool.length > 1; i++){
    const idx = Math.floor(Math.random() * pool.length);
    removeAgent(pool[idx]); pool.splice(idx, 1); lost++;
  }
  return lost;
}

function moveAgent(agent){
  agent.prevX = agent.nextX; agent.prevZ = agent.nextZ; agent.prevY = agent.nextY;
  let dirs = neighborsOf(agent.cx, agent.cz).filter(([x, z]) => isLand(x, z));
  if(!dirs.length) return;
  // citizens drift toward their own land, wanderers roam freely
  if(agent.nationId){
    const own = dirs.filter(([x, z]) => tiles[z][x].owner === agent.nationId);
    if(own.length && Math.random() < 0.75) dirs = own;
  }
  const [nx, nz] = pick(dirs);
  agent.cx = nx; agent.cz = nz;
  agent.nextX = cellX(nx); agent.nextZ = cellZ(nz); agent.nextY = tiles[nz][nx].y;
  const dx = agent.nextX - agent.prevX, dz = agent.nextZ - agent.prevZ;
  if(dx || dz) agent.mesh.rotation.y = Math.atan2(dx, dz);
}

function randomLandCell(){
  for(let i = 0; i < 90; i++){
    const cx = Math.floor(Math.random() * GRID), cz = Math.floor(Math.random() * GRID);
    if(isLand(cx, cz)) return { cx, cz };
  }
  return { cx: GRID >> 1, cz: GRID >> 1 };
}

/* ============================ NATIONS ============================ */
function nearestNationDistance(cx, cz){
  let best = Infinity;
  for(const n of nations){
    if(n.eliminated) continue;
    const d = Math.hypot(n.capital.cx - cx, n.capital.cz - cz);
    if(d < best) best = d;
  }
  return best;
}

function createCapitalMarker(nation, cx, cz){
  const g = new THREE.Group();
  const poleH = 1.25;
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, poleH, 6), new THREE.MeshLambertMaterial({ color: 0xd8d2c4 }));
  pole.position.y = poleH / 2; g.add(pole);
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.36, 0.22), new THREE.MeshLambertMaterial({ color: nation.color.clone(), side: THREE.DoubleSide }));
  flag.position.set(0.19, poleH - 0.14, 0); g.add(flag);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.3, 0.1, 8), new THREE.MeshLambertMaterial({ color: nation.color.clone().multiplyScalar(0.6) }));
  base.position.y = 0.05; g.add(base);
  g.position.set(cellX(cx), tiles[cz][cx].y, cellZ(cz));
  g.userData.flag = flag;
  return g;
}

function foundNation(agent){
  const nation = {
    id: nextNationId, name: makeNationName(), color: makeNationColor(nextNationId),
    trait: pick(TRAITS),
    capital: { cx: agent.cx, cz: agent.cz },
    tiles: new Set(), wars: new Map(), allies: new Set(), trades: new Set(),
    stock: { food: 14, wood: 16, ore: 4, gold: 8 },
    science: 0, era: 0, stability: 0.66, pop: 1, popCap: 4,
    buildings: {}, armyBonus: 0, defenceBonus: 0,
    founded: day, eliminated: false, log: [],
    cooldowns: { expand: 3, grow: 2, build: 4, diplo: 5 + Math.floor(Math.random() * 6), army: 8 },
    peak: { tiles: 1, pop: 1 }
  };
  nextNationId++;
  nations.push(nation);
  nationsById.set(nation.id, nation);
  claimTile(nation, agent.cx, agent.cz);
  agent.nationId = nation.id;
  agent.mesh.material.color.copy(nation.color);
  nation.capitalMesh = createCapitalMarker(nation, agent.cx, agent.cz);
  scene.add(nation.capitalMesh);
  noteHistory(nation, 'Founded on day ' + day);
  fireEvent({
    kind: 'found', icon: '🚩', color: 0x4fb9a1,
    title: nation.name + ' is founded',
    text: `A ${nation.trait.name.toLowerCase()} people (${nation.trait.icon}) raise their flag.`,
    cx: agent.cx, cz: agent.cz
  });
}

function noteHistory(nation, text){
  nation.log.unshift({ day, text });
  if(nation.log.length > 14) nation.log.pop();
}

function claimTile(nation, cx, cz, viaConquest){
  const t = tiles[cz][cx];
  if(t.owner === nation.id || t.type === 'water') return;
  const prevId = t.owner;
  if(prevId){
    const prev = nationsById.get(prevId);
    if(prev){
      prev.tiles.delete(key(cx, cz));
      if(t.building) prev.buildings[t.building] = Math.max(0, (prev.buildings[t.building] || 0) - 1);
      if(prev.tiles.size === 0 && !prev.eliminated) eliminateNation(prev, 'conquered');
    }
  }
  t.owner = nation.id;
  nation.tiles.add(key(cx, cz));
  if(t.building) nation.buildings[t.building] = (nation.buildings[t.building] || 0) + 1;
  if(t.buildingMesh) recolorBuilding(t.buildingMesh, nation.color);
  for(const a of agents){
    if(a.cx === cx && a.cz === cz && a.nationId === null){
      a.nationId = nation.id;
      a.mesh.material.color.copy(nation.color);
    }
  }
  terrainDirty = true;
}

function eliminateNation(nation, reason){
  nation.eliminated = true;
  nation.deadDay = day;
  for(const eid of nation.wars.keys()){ const e = nationsById.get(eid); if(e) e.wars.delete(nation.id); }
  nation.wars.clear();
  for(const aid of nation.allies){ const a = nationsById.get(aid); if(a) a.allies.delete(nation.id); }
  nation.allies.clear();
  for(const tid of nation.trades){ const t = nationsById.get(tid); if(t) t.trades.delete(nation.id); }
  nation.trades.clear();
  for(const k of nation.tiles){ const [cx, cz] = parseKey(k); if(tiles[cz][cx].owner === nation.id) tiles[cz][cx].owner = null; }
  nation.tiles.clear();
  disposeObj(nation.capitalMesh); nation.capitalMesh = null;
  for(const a of agents){
    if(a.nationId === nation.id){ a.nationId = null; a.mesh.material.color.set(0x9aa5b8); }
  }
  for(let i = armies.length - 1; i >= 0; i--) if(armies[i].nationId === nation.id) destroyArmy(armies[i]);
  terrainDirty = true;
  fireEvent({
    kind: 'war', icon: '🏴', color: 0xd9584a, major: true,
    title: nation.name + ' has fallen',
    text: `After ${day - nation.founded} days the last of it was ${reason}.`,
    cx: nation.capital.cx, cz: nation.capital.cz
  });
}

/* ============================ SURVEY & ECONOMY ============================ */
function surveyNation(n){
  const s = { food: 0, wood: 0, ore: 0, gold: 0, sci: 0, cap: 0, stab: 0, defence: 0, armyBonus: 0, farmland: 0, forest: 0, ore_t: 0, rock: 0, coast: 0, open: 0 };
  for(const k of n.tiles){
    const [cx, cz] = parseKey(k);
    const t = tiles[cz][cx];
    if(!t.building) s.open++;
    if(isCoastal(cx, cz)) s.coast++;
    if(t.resource === 'rock') s.rock++;
    if(t.resource === 'farmland'){ s.food += 0.30; s.farmland++; }
    else if(t.resource === 'forest'){ s.wood += 0.20; s.forest++; }
    else if(t.resource === 'reeds'){ s.food += 0.18; }
    else if(t.resource === 'ore'){ s.ore += 0.12; s.ore_t++; }
    else if(t.resource === 'plain'){ s.food += 0.12; }
    else if(t.resource === 'rock'){ s.ore += 0.05; }
    if(t.building){
      const b = BUILDINGS[t.building];
      if(b.yield.food) s.food += b.yield.food;
      if(b.yield.wood) s.wood += b.yield.wood;
      if(b.yield.ore) s.ore += b.yield.ore;
      if(b.yield.gold) s.gold += b.yield.gold;
      if(b.yield.sci) s.sci += b.yield.sci;
      s.cap += b.cap || 0;
      s.stab += b.stability || 0;
      s.defence += b.defence || 0;
      s.armyBonus += b.armyPower || 0;
    }
  }
  s.cap += 3 + n.tiles.size * 0.32;
  s.sci += 0.05 * n.pop;
  s.gold += 0.04 * n.pop;
  return s;
}

function economyTick(n){
  const s = surveyNation(n);
  n.survey = s;
  n.popCap = Math.floor(s.cap);
  n.defenceBonus = s.defence;
  n.armyBonus = s.armyBonus;

  const seasonGrowth = options.seasons ? season().growth : 1;
  const eraDef = ERAS[n.era];
  const foodIn = s.food * n.trait.food * seasonGrowth * eraDef.growth;
  const eaten = n.pop * 0.52 + armiesOf(n).length * 0.8;
  n.stock.food += foodIn - eaten;
  n.stock.wood += s.wood * 0.9;
  n.stock.ore += s.ore * 0.9;
  n.stock.gold += s.gold - armiesOf(n).length * 0.45;
  n.science += s.sci * n.trait.sci * (1 + n.era * 0.08);

  n.foodFlow = foodIn - eaten;

  if(n.stock.food < 0){
    n.stock.food = 0;
    n.stability -= 0.055;
    if(Math.random() < 0.4 && n.pop > 1){
      const lost = killCitizens(n, 1);
      if(lost && Math.random() < 0.35){
        fireEvent({ kind:'disaster', icon:'🍂', color:0xc07a33, title:'Famine in ' + n.name,
          text:'The granaries are empty and people are leaving.', cx:n.capital.cx, cz:n.capital.cz, quiet:true });
      }
    }
  }
  if(n.stock.gold < 0){
    n.stock.gold = 0;
    n.stability -= 0.02;
    const own = armiesOf(n);
    if(own.length){ destroyArmy(own[own.length - 1]); noteHistory(n, 'An army disbanded — the treasury ran dry'); }
  }
  n.stock.food = Math.min(n.stock.food, 60 + n.tiles.size * 6);
  n.stock.wood = Math.min(n.stock.wood, 140);
  n.stock.ore = Math.min(n.stock.ore, 140);
  n.stock.gold = Math.min(n.stock.gold, 320);

  // stability drifts toward an equilibrium set by food, faith, war and size
  let target = 0.58 + s.stab;
  target += clamp(n.foodFlow * 0.05, -0.2, 0.16);
  target -= n.wars.size * 0.11;
  target += n.allies.size * 0.03 + n.trades.size * 0.03;
  target -= Math.max(0, n.tiles.size - (16 + n.era * 9)) * 0.012;
  target += n.era * 0.015;
  n.stability += (clamp(target, 0.02, 0.98) - n.stability) * 0.07;
  n.stability = clamp(n.stability, 0, 1);

  // advance an age
  while(n.era < ERAS.length - 1 && n.science >= ERAS[n.era + 1].science){
    n.era++;
    noteHistory(n, 'Entered the ' + ERAS[n.era].name);
    fireEvent({
      kind: 'tech', icon: ERAS[n.era].icon, color: 0x8f7fdd,
      title: n.name + ' enters the ' + ERAS[n.era].name,
      text: 'New crafts, new buildings, new appetites.',
      cx: n.capital.cx, cz: n.capital.cz
    });
  }
}

/* ============================ BUILDINGS ============================ */
function canAfford(n, cost){
  for(const r in cost) if((n.stock[r] || 0) < cost[r]) return false;
  return true;
}
function payCost(n, cost){ for(const r in cost) n.stock[r] -= cost[r]; }

function buildingScore(n, id, s){
  const b = BUILDINGS[id];
  if(b.era > n.era) return -1;
  if(!canAfford(n, b.cost)) return -1;
  let score = 1;
  const flow = n.foodFlow || 0;
  switch(id){
    case 'farm':    score = 6 + clamp(-flow, 0, 6) * 2.2 + (n.stock.food < 12 ? 5 : 0); break;
    case 'camp':    score = 4 + (n.stock.wood < 20 ? 6 : 0); break;
    case 'hut':     score = n.pop >= n.popCap - 1 ? 7 : 1.4; break;
    case 'granary': score = 3.5 + (n.stock.food < 22 ? 4 : 0) + (seasonIndex === 2 ? 2 : 0); break;
    case 'house':   score = n.pop >= n.popCap - 2 ? 8 : 2; break;
    case 'harbour': score = 6 + clamp(-flow, 0, 4) * 1.5; break;
    case 'mine':    score = 5 + (n.stock.ore < 16 ? 4 : 0); break;
    case 'quarry':  score = 3 + (n.stock.ore < 10 ? 3.5 : 0); break;
    case 'shrine':  score = 3 + (n.stability < 0.5 ? 9 : 0); break;
    case 'market':  score = 5 + (n.stock.gold < 30 ? 3 : 0); break;
    case 'windmill':score = 5 + clamp(-flow, 0, 4) * 1.6; break;
    case 'workshop':score = 4.5 + (n.stock.wood < 24 || n.stock.ore < 20 ? 2.5 : 0); break;
    case 'barracks':score = n.wars.size ? 9 : 2.5; break;
    case 'tower':   score = n.wars.size ? 6 : 1.5; break;
    case 'library': score = 7 * n.trait.sci; break;
    case 'forge':   score = n.wars.size ? 7 : 3.5; break;
    case 'aqueduct':score = n.pop >= n.popCap - 2 ? 7.5 : 2.2; break;
    case 'amphi':   score = 3 + (n.stability < 0.55 ? 8 : 0); break;
    case 'fortress':score = n.wars.size ? 8 : 2; break;
    case 'observatory': score = 6 * n.trait.sci; break;
    case 'university':  score = 8 * n.trait.sci; break;
    case 'wonder':  score = n.stability > 0.6 ? 6 : 2; break;
  }
  const have = n.buildings[id] || 0;
  if(id === 'wonder') score -= have * 5;
  else if(id === 'university' || id === 'observatory' || id === 'amphi' || id === 'fortress') score -= have * 2.2;
  else score -= have * 0.55;
  if(b.needs === 'farmland' && !s.farmland) return -1;
  if(b.needs === 'forest' && !s.forest) return -1;
  if(b.needs === 'ore' && !s.ore_t) return -1;
  if(b.needs === 'rock' && !s.rock) return -1;
  if(b.needs === 'coast' && !s.coast) return -1;
  return score + Math.random() * 1.6;
}

function findBuildSite(n, needs){
  const open = [];
  for(const k of n.tiles){
    const [cx, cz] = parseKey(k);
    const t = tiles[cz][cx];
    if(t.building) continue;
    if(needs === 'coast'){ if(!isCoastal(cx, cz)) continue; }
    else if(needs && t.resource !== needs) continue;
    else if(!needs && t.type === 'mountain' && Math.random() < 0.7) continue;
    open.push([cx, cz]);
  }
  if(!open.length) return null;
  // prefer sites near the capital so towns cluster
  open.sort((a, b) =>
    Math.hypot(a[0] - n.capital.cx, a[1] - n.capital.cz) - Math.hypot(b[0] - n.capital.cx, b[1] - n.capital.cz));
  return open[Math.floor(Math.pow(Math.random(), 1.7) * Math.min(open.length, 9))];
}

function chooseAndBuild(n){
  if(buildingCount >= MAX_BUILDINGS) return;
  const s = n.survey || surveyNation(n);
  let bestId = null, bestScore = 0;
  for(const id of BUILD_ORDER){
    const sc = buildingScore(n, id, s);
    if(sc > bestScore){ bestScore = sc; bestId = id; }
  }
  if(!bestId) return;
  const b = BUILDINGS[bestId];
  const site = findBuildSite(n, b.needs);
  if(!site) return;
  payCost(n, b.cost);
  placeBuilding(n, bestId, site[0], site[1]);
}

function recolorBuilding(group, color){
  const wall = color.clone().multiplyScalar(0.85);
  for(const m of group.userData.walls) m.material.color.copy(wall);
}

function createBuildingMesh(nation, type, cx, cz){
  const g = new THREE.Group();
  const wallColor = nation.color.clone().multiplyScalar(0.85);
  // every roof is thatch, tile or slate, nudged toward the nation's colour,
  // so two huts of the same state still read as two different houses
  const ROOFS = [0x7a5535, 0x5d4430, 0x8c4f38, 0x4a4f56, 0x6b5a3c];
  const roofColor = new THREE.Color(pick(ROOFS)).lerp(nation.color, 0.12 + Math.random() * 0.14);
  const stoneColor = new THREE.Color(0xa49b8c).lerp(nation.color, 0.1);
  const walls = [];
  const v = Math.random();
  const wallMat = () => new THREE.MeshLambertMaterial({ color: wallColor.clone() });
  const roofMat = () => new THREE.MeshLambertMaterial({ color: roofColor.clone() });
  const plain = (hex) => new THREE.MeshLambertMaterial({ color: hex });
  const stoneMat = () => { const m = new THREE.MeshLambertMaterial({ color: stoneColor.clone() }); walls.push({ material: m }); return m; };

  function box(w, h, d, y, x, z, mat){
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat || wallMat());
    m.position.set(x || 0, y + h / 2, z || 0);
    g.add(m); if(!mat) walls.push(m);
    return m;
  }
  function cone(r, h, y, seg, mat){
    const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg || 4), mat || roofMat());
    m.position.y = y + h / 2;
    m.rotation.y = Math.PI / 4;
    g.add(m);
    return m;
  }
  function cyl(rt, rb, h, y, mat){
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 8), mat || wallMat());
    m.position.y = y + h / 2; g.add(m); if(!mat) walls.push(m);
    return m;
  }

  function prop(chance, fn){ if(Math.random() < chance) fn(); }
  function barrel(x, z){ const m = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.14, 7), plain(0x6b5236)); m.position.set(x, 0.07, z); g.add(m); }
  function fence(z){
    for(let i = -1; i <= 1; i++){ const m = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.16, 0.04), plain(0x7a6142)); m.position.set(i * 0.18, 0.08, z); g.add(m); }
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.03, 0.03), plain(0x7a6142)); rail.position.set(0, 0.13, z); g.add(rail);
  }
  function banner(x, y, z){
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.3, 5), plain(0xcfc9bb)); p.position.set(x, y + 0.15, z); g.add(p);
    const f = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.1), new THREE.MeshLambertMaterial({ color: nation.color.clone(), side: THREE.DoubleSide }));
    f.position.set(x + 0.08, y + 0.24, z); g.add(f);
  }

  switch(type){
    case 'hut': {
      if(v < 0.34){ const h = 0.3 + Math.random() * 0.14; cyl(0.2, 0.23, h, 0); cone(0.3, 0.26, h, 7); }
      else if(v < 0.68){ const h = 0.34 + Math.random() * 0.16; box(0.4, h, 0.4, 0); cone(0.34, 0.24, h, 4); }
      else { const h = 0.16; box(0.36, h, 0.44, 0); cone(0.36, 0.42, h, 3); }
      prop(0.35, () => barrel(0.26, 0.22));
      break;
    }
    case 'house': {
      const h = 0.62 + Math.random() * 0.4;
      if(v < 0.5){ box(0.5, h, 0.46, 0); cone(0.42, 0.34, h, 4); }
      else { box(0.62, h * 0.82, 0.4, 0); box(0.3, h, 0.3, 0, -0.2, 0.06); cone(0.5, 0.3, h * 0.82, 4); }
      prop(0.45, () => box(0.07, 0.22, 0.07, h, 0.14, 0.12, plain(0x584435)));
      prop(0.3, () => fence(0.36));
      break;
    }
    case 'farm': {
      box(0.74, 0.05, 0.74, 0, 0, 0, plain(v < 0.5 ? 0x8c9a46 : 0xa8993f));
      for(let i = -1; i <= 1; i++) box(0.62, 0.035, 0.07, 0.05, 0, i * 0.2, plain(0x6d7c34));
      box(0.22, 0.24, 0.22, 0.05, -0.2, -0.2); cone(0.19, 0.17, 0.29, 4);
      prop(0.4, () => barrel(0.24, -0.24));
      break;
    }
    case 'granary': {
      cyl(0.19, 0.22, 0.46, 0); cone(0.3, 0.22, 0.46, 9);
      box(0.1, 0.2, 0.1, 0, 0.22, 0.18, plain(0x7a6142));
      prop(0.5, () => barrel(-0.26, 0.2));
      break;
    }
    case 'camp': {
      box(0.34, 0.2, 0.34, 0); cone(0.3, 0.3, 0.2, 5);
      for(let i = 0; i < 3; i++) box(0.07, 0.07, 0.46, 0.02 + i * 0.075, 0.28, (i - 1) * 0.03, plain(0x6b5236));
      break;
    }
    case 'quarry': {
      box(0.62, 0.08, 0.62, 0, 0, 0, plain(0x6f6a63));
      box(0.2, 0.2, 0.2, 0.08, 0.14, 0.12);
      for(let i = 0; i < 3; i++){
        const r = new THREE.Mesh(new THREE.DodecahedronGeometry(0.07, 0), plain(0x8a857d));
        r.position.set((Math.random() - 0.5) * 0.44, 0.12, (Math.random() - 0.5) * 0.44); g.add(r);
      }

    }
    case 'mine': {
      box(0.36, 0.26, 0.36, 0); cone(0.3, 0.2, 0.26, 4);
      const c = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.2, 4), plain(0x86c0dc));
      c.position.set(0.24, 0.1, 0.2); g.add(c);
      box(0.06, 0.34, 0.06, 0, -0.22, -0.2, plain(0x584435));
      break;
    }
    case 'harbour': {
      box(0.58, 0.07, 0.24, 0, 0, 0.2, plain(0x7a6142));
      for(const x of [-0.22, 0, 0.22]) box(0.05, 0.16, 0.05, -0.1, x, 0.3, plain(0x584435));
      box(0.3, 0.28, 0.3, 0, -0.14, -0.16); cone(0.26, 0.2, 0.28, 4);
      const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.42, 5), plain(0xcfc9bb));
      mast.position.set(0.16, 0.28, 0.2); g.add(mast);
      const sail = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.26), new THREE.MeshLambertMaterial({ color: 0xe8e0cd, side: THREE.DoubleSide }));
      sail.position.set(0.16, 0.34, 0.2); g.add(sail);
      break;
    }
    case 'shrine': {
      cyl(0.17, 0.2, 0.42, 0);
      cone(0.3, 0.26, 0.42, 8, plain(0xd7a13c));
      prop(0.5, () => { for(const x of [-0.26, 0.26]) box(0.05, 0.3, 0.05, 0, x, 0.18, plain(0xb08a4c)); });
      break;
    }
    case 'windmill': {
      cyl(0.16, 0.22, 0.66, 0);
      cone(0.24, 0.18, 0.66, 8);
      const hub = new THREE.Group();
      for(let i = 0; i < 4; i++){
        const b = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.42, 0.1), plain(0xe0d7c2));
        b.position.y = 0.21;
        const holder = new THREE.Object3D(); holder.rotation.z = i * Math.PI / 2;
        holder.add(b); hub.add(holder);

      hub.position.set(0, 0.6, 0.24);

    case 'workshop': {
      box(0.56, 0.34, 0.44, 0);
      box(0.6, 0.06, 0.5, 0.34, 0, 0, roofMat());

      prop(0.6, () => barrel(-0.3, 0.22));

    case 'barracks': {
      box(0.66, 0.42, 0.34, 0); cone(0.38, 0.2, 0.42, 4);

      for(const [x, z] of [[-0.28,-0.28],[0.28,-0.28],[-0.28,0.28],[0.28,0.28]]) box(0.05, 0.38, 0.05, 0, x, z);

      orb.position.y = 1.22; g.add(orb); g.userData.orb = orb;
      break;
    }
    default: { box(0.4, 0.3, 0.4, 0); }
  }

  g.position.set(cellX(cx), tiles[cz][cx].y, cellZ(cz));
  g.rotation.y = (Math.random() - 0.5) * 0.5;
  g.userData.walls = walls;
  g.userData.type = type;
  g.visible = options.buildings;
  return g;
}

function placeBuilding(n, type, cx, cz){
  const t = tiles[cz][cx];
  if(t.building) return;
  t.building = type;
  buildingCount++;
  n.buildings[type] = (n.buildings[type] || 0) + 1;
  const mesh = createBuildingMesh(n, type, cx, cz);
  scene.add(mesh);
  t.buildingMesh = mesh;
  if(mesh.userData.spin) spinners.push(mesh.userData.spin);
  spawnFloatIcon(cx, cz, BUILDINGS[type].icon, 0xd7a13c, 0.75);
  if(type === 'wonder' || type === 'library'){
    fireEvent({ kind:'boon', icon: BUILDINGS[type].icon, color: 0xd7a13c,
      title: n.name + ' completes a ' + BUILDINGS[type].name,
      text: BUILDINGS[type].desc, cx, cz, quiet: type !== 'wonder' });
  }
}

function destroyBuilding(cx, cz){
  const t = tiles[cz][cx];
  if(!t.building) return null;
  const type = t.building;
  if(t.owner){
    const n = nationsById.get(t.owner);
    if(n) n.buildings[type] = Math.max(0, (n.buildings[type] || 0) - 1);
  }
  disposeObj(t.buildingMesh);
  t.buildingMesh = null; t.building = null;
  buildingCount--;
  return type;
}

/* ============================ ARMIES ============================ */
function armiesOf(n){ return armies.filter(a => a.nationId === n.id); }

function armyStrengthFor(n){
  const barracks = n.buildings.barracks || 0;
  return (9 + n.tiles.size * 0.35 + barracks * 5 + n.pop * 0.5)
    * n.trait.power * ERAS[n.era].power * (1 + (n.armyBonus || 0));
}

function raiseArmy(n){
  if(armies.length >= MAX_ARMIES) return;
  if(armiesOf(n).length >= 1 + Math.floor(n.tiles.size / 12)) return;
  if(n.pop < 3 || n.stock.food < 12 || n.stock.gold < 5) return;
  n.stock.food -= 10; n.stock.gold -= 5;
  killCitizens(n, 1);
  const { cx, cz } = n.capital;
  const mesh = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.24, 0.62, 5), new THREE.MeshLambertMaterial({ color: n.color.clone() }));
  body.position.y = 0.31; mesh.add(body);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.2, 0.3, 14), new THREE.MeshBasicMaterial({ color: n.color.clone(), transparent: true, opacity: 0.65, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.03; mesh.add(ring);
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.3, 0.09), new THREE.MeshLambertMaterial({ color: 0xd9d3c4 }));
  blade.position.set(0.15, 0.42, 0); mesh.add(blade);
  mesh.position.set(cellX(cx), tiles[cz][cx].y, cellZ(cz));
  mesh.visible = options.armies;
  scene.add(mesh);
  const army = {
    id: nextArmyId++, nationId: n.id, cx, cz, strength: armyStrengthFor(n),
    prevX: cellX(cx), prevZ: cellZ(cz), prevY: tiles[cz][cx].y,
    nextX: cellX(cx), nextZ: cellZ(cz), nextY: tiles[cz][cx].y,
    mesh, target: null, retarget: 0
  };
  armies.push(army);
  spawnFloatIcon(cx, cz, '🗡️', n.color.getHex(), 0.9);
  return army;
}

function destroyArmy(army){
  disposeObj(army.mesh);
  const i = armies.indexOf(army);
  if(i >= 0) armies.splice(i, 1);
}

function findArmyTarget(army){
  const n = nationsById.get(army.nationId);
  if(!n || !n.wars.size) return null;
  let best = null, bestD = Infinity;
  for(const enemyId of n.wars.keys()){
    const e = nationsById.get(enemyId);
    if(!e || e.eliminated) continue;
    for(const k of e.tiles){
      const [cx, cz] = parseKey(k);
      const d = Math.hypot(cx - army.cx, cz - army.cz);
      if(d < bestD){ bestD = d; best = { cx, cz }; }
    }
  }
  return best;
}

function stepArmy(army){
  const n = nationsById.get(army.nationId);
  if(!n || n.eliminated){ destroyArmy(army); return; }
  army.prevX = army.nextX; army.prevZ = army.nextZ; army.prevY = army.nextY;

  if(!n.wars.size){
    // war is over — march home and stand down
    const d = Math.hypot(army.cx - n.capital.cx, army.cz - n.capital.cz);
    if(d < 1.5){ destroyArmy(army); return; }
    army.target = { cx: n.capital.cx, cz: n.capital.cz };
  } else if(!army.target || army.retarget-- <= 0 || tiles[army.target.cz][army.target.cx].owner === army.nationId){
    army.target = findArmyTarget(army);
    army.retarget = 8;
  }
  if(!army.target){ destroyArmy(army); return; }

  const options_ = neighborsOf(army.cx, army.cz).filter(([x, z]) => isLand(x, z));
  if(!options_.length) return;
  options_.sort((a, b) =>
    Math.hypot(a[0] - army.target.cx, a[1] - army.target.cz) - Math.hypot(b[0] - army.target.cx, b[1] - army.target.cz));
  const [nx, nz] = Math.random() < 0.82 ? options_[0] : pick(options_);
  army.cx = nx; army.cz = nz;
  army.nextX = cellX(nx); army.nextZ = cellZ(nz); army.nextY = tiles[nz][nx].y;
  const dx = army.nextX - army.prevX, dz = army.nextZ - army.prevZ;
  if(dx || dz) army.mesh.rotation.y = Math.atan2(dx, dz);

  // meet an enemy army?
  for(const other of armies){
    if(other === army || other.nationId === army.nationId) continue;
    if(other.cx === army.cx && other.cz === army.cz && n.wars.has(other.nationId)){
      clashArmies(army, other); return;
    }
  }
  const t = tiles[nz][nx];
  if(t.owner && t.owner !== army.nationId && n.wars.has(t.owner)) assaultTile(army, nx, nz);
}

function clashArmies(a, b){
  const na = nationsById.get(a.nationId), nb = nationsById.get(b.nationId);
  if(!na || !nb) return;
  const pa = a.strength * (0.8 + Math.random() * 0.4);
  const pb = b.strength * (0.8 + Math.random() * 0.4);
  const winner = pa >= pb ? a : b, loser = pa >= pb ? b : a;
  const wn = nationsById.get(winner.nationId), ln = nationsById.get(loser.nationId);
  winner.strength *= 0.55 + Math.random() * 0.2;
  spawnGroundRing(a.cx, a.cz, wn.color.getHex(), 1.5);
  spawnFloatIcon(a.cx, a.cz, '⚔️', 0xd9584a, 1.35);
  destroyArmy(loser);
  killCitizens(ln, 1);
  fireEvent({
    kind: 'war', icon: '⚔️', color: 0xd9584a,
    title: 'Armies clash in the field',
    text: `<b>${wn.name}</b> destroyed a <b>${ln.name}</b> army.`,
    cx: a.cx, cz: a.cz, noMark: true
  });
}

function tileDefence(nation, cx, cz){
  let d = 6 + nation.tiles.size * 0.22 + nation.pop * 0.4;
  const t = tiles[cz][cx];
  if(t.building && BUILDINGS[t.building].defence) d *= 1 + BUILDINGS[t.building].defence * 2.2;
  if(t.type === 'mountain') d *= 1.35;
  if(cx === nation.capital.cx && cz === nation.capital.cz) d *= 1.4;
  for(const army of armies) if(army.nationId === nation.id && army.cx === cx && army.cz === cz) d += army.strength * 0.7;
  return d * nation.trait.power * ERAS[nation.era].power * (1 + nation.defenceBonus * 0.5);
}

function assaultTile(army, cx, cz){
  const attacker = nationsById.get(army.nationId);
  const defender = nationsById.get(tiles[cz][cx].owner);
  if(!attacker || !defender) return;
  const atk = army.strength * (0.85 + Math.random() * 0.3);
  const def = tileDefence(defender, cx, cz) * (0.85 + Math.random() * 0.3);
  const win = atk > def;
  spawnGroundRing(cx, cz, (win ? attacker.color : defender.color).getHex(), 1.4);
  spawnFloatIcon(cx, cz, win ? '🔥' : '🛡️', win ? 0xd9584a : 0x4fb9a1, 1.2);
  if(win){
    army.strength *= 0.72;
    const razed = Math.random() < 0.3 ? destroyBuilding(cx, cz) : null;
    claimTile(attacker, cx, cz, true);
    killCitizens(defender, 1);
    attacker.warScore = (attacker.warScore || 0) + 1;
    fireEvent({
      kind: 'war', icon: '⚔️', color: attacker.color.getHex(),
      title: attacker.name + ' takes ground',
      text: `A tile of <b>${defender.name}</b> falls${razed ? ', and its ' + BUILDINGS[razed].name.toLowerCase() + ' burns' : ''}.`,
      cx, cz, noMark: true, quiet: true
    });
  } else {
    army.strength *= 0.6;
    killCitizens(attacker, 1);
    if(army.strength < 6){
      destroyArmy(army);
      fireEvent({ kind:'war', icon:'🛡️', color: defender.color.getHex(),
        title: defender.name + ' holds the line',
        text: `An army of <b>${attacker.name}</b> was broken and scattered.`, cx, cz, noMark: true, quiet: true });
    }
  }
}

/* ============================ DIPLOMACY ============================ */
function neighborNationIds(n){
  const ids = new Set();
  for(const k of n.tiles){
    const [cx, cz] = parseKey(k);
    for(const [nx, nz] of neighborsOf(cx, cz)){
      if(!inBounds(nx, nz)) continue;
      const o = tiles[nz][nx].owner;
      if(o && o !== n.id) ids.add(o);
    }
  }
  return ids;
}

function declareWar(a, b, cause){
  if(a.wars.has(b.id)) return;
  a.wars.set(b.id, { startDay: day });
  b.wars.set(a.id, { startDay: day });
  a.allies.delete(b.id); b.allies.delete(a.id);
  a.trades.delete(b.id); b.trades.delete(a.id);
  noteHistory(a, 'Declared war on ' + b.name);
  noteHistory(b, 'Attacked by ' + a.name);
  fireEvent({
    kind: 'war', icon: '⚔️', color: 0xd9584a, major: true,
    title: 'War: ' + a.name + ' vs ' + b.name,
    text: cause || `<b>${a.name}</b> marches on <b>${b.name}</b>.`,
    cx: b.capital.cx, cz: b.capital.cz
  });
  // allies are drawn in
  for(const allyId of Array.from(a.allies)){
    const ally = nationsById.get(allyId);
    if(ally && !ally.eliminated && !ally.wars.has(b.id) && Math.random() < 0.55){
      ally.wars.set(b.id, { startDay: day }); b.wars.set(ally.id, { startDay: day });
      fireEvent({ kind:'war', icon:'🤝', color:0xd9584a,
        title: ally.name + ' honours its alliance',
        text: `It joins <b>${a.name}</b> against <b>${b.name}</b>.`,
        cx: ally.capital.cx, cz: ally.capital.cz, quiet: true });
    }
  }
}

function makePeace(a, b){
  if(!a || !b || !a.wars.has(b.id)) return;
  const dur = day - (a.wars.get(b.id).startDay || day);
  a.wars.delete(b.id); b.wars.delete(a.id);
  noteHistory(a, 'Peace with ' + b.name);
  noteHistory(b, 'Peace with ' + a.name);
  fireEvent({
    kind: 'peace', icon: '🕊️', color: 0x4fb9a1,
    title: 'Peace between ' + a.name + ' and ' + b.name,
    text: `The war lasted ${dur} days.`,
    cx: a.capital.cx, cz: a.capital.cz
  });
}

function formAlliance(a, b){
  a.allies.add(b.id); b.allies.add(a.id);
  fireEvent({
    kind: 'peace', icon: '🤝', color: 0x4fb9a1,
    title: 'An alliance is sworn',
    text: `<b>${a.name}</b> and <b>${b.name}</b> will answer each other's wars.`,
    cx: b.capital.cx, cz: b.capital.cz
  });
}

function formTrade(a, b){
  a.trades.add(b.id); b.trades.add(a.id);
  fireEvent({
    kind: 'boon', icon: '🏺', color: 0xd7a13c,
    title: 'A trade route opens',
    text: `Caravans run between <b>${a.name}</b> and <b>${b.name}</b>.`,
    cx: a.capital.cx, cz: a.capital.cz, quiet: true
  });
}

function considerDiplomacy(n){
  if(--n.cooldowns.diplo > 0) return;
  n.cooldowns.diplo = 6 + Math.floor(Math.random() * 8);
  const neighbors = neighborNationIds(n);

  let acted = false;
  for(const oid of neighbors){
    if(n.wars.has(oid) || n.allies.has(oid)) continue;
    const o = nationsById.get(oid);
    if(!o || o.eliminated) continue;
    const mine = n.tiles.size + n.pop * 1.4 + armiesOf(n).length * 6;
    const theirs = o.tiles.size + o.pop * 1.4 + armiesOf(o).length * 6;
    const hunger = clamp(mine / (theirs + 1), 0.4, 2.0);
    const chance = 0.2 * n.trait.aggression * hunger * (n.stability < 0.4 ? 1.5 : 1);
    if(Math.random() < chance){
      declareWar(n, o, `<b>${n.name}</b> claims the borderland of <b>${o.name}</b>.`);
      acted = true; break;
    }
  }
  if(!acted){
    for(const oid of neighbors){
      if(n.wars.has(oid) || n.allies.has(oid)) continue;
      const o = nationsById.get(oid);
      if(!o || o.eliminated) continue;
      if(Math.random() < 0.05 * n.trait.alliance * o.trait.alliance){ formAlliance(n, o); acted = true; break; }
      if(!n.trades.has(oid) && Math.random() < 0.07 * n.trait.alliance){ formTrade(n, o); acted = true; break; }
    }
  }

  for(const eid of Array.from(n.wars.keys())){
    const info = n.wars.get(eid);
    const e = nationsById.get(eid);
    if(!e || e.eliminated){ n.wars.delete(eid); continue; }
    const dur = day - info.startDay;
    const weary = clamp(dur * 0.013, 0, 0.9) * n.trait.weariness * (n.stability < 0.35 ? 1.6 : 1);
    if(Math.random() < weary * 0.16) makePeace(n, e);
  }

  for(const aid of Array.from(n.allies)){
    if(Math.random() < 0.004){
      const ally = nationsById.get(aid);
      if(!ally) continue;
      n.allies.delete(aid); ally.allies.delete(n.id);
      fireEvent({ kind:'war', icon:'💔', color:0xc07a33,
        title:'An alliance dissolves',
        text:`<b>${n.name}</b> and <b>${ally.name}</b> part ways.`,
        cx:n.capital.cx, cz:n.capital.cz, quiet:true });
    }
  }
}

/* ============================ REBELLION ============================ */
function considerRebellion(n){
  if(n.stability > 0.2 || n.tiles.size < 9) return;
  if(Math.random() > 0.06) return;
  const all = Array.from(n.tiles).map(parseKey);
  all.sort((a, b) =>
    Math.hypot(b[0] - n.capital.cx, b[1] - n.capital.cz) - Math.hypot(a[0] - n.capital.cx, a[1] - n.capital.cz));
  const take = all.slice(0, Math.max(3, Math.floor(all.length * 0.42)));
  const seat = take[0];

  const rebel = {
    id: nextNationId, name: makeNationName(), color: makeNationColor(nextNationId),
    trait: pick(TRAITS), capital: { cx: seat[0], cz: seat[1] },
    tiles: new Set(), wars: new Map(), allies: new Set(), trades: new Set(),
    stock: { food: 10, wood: 10, ore: 4, gold: 4 },
    science: n.science * 0.5, era: n.era, stability: 0.6, pop: 0, popCap: 4,
    buildings: {}, armyBonus: 0, defenceBonus: 0,
    founded: day, eliminated: false, log: [],
    cooldowns: { expand: 3, grow: 2, build: 4, diplo: 4, army: 4 },
    peak: { tiles: take.length, pop: 0 }
  };
  nextNationId++;
  nations.push(rebel);
  nationsById.set(rebel.id, rebel);
  rebel.capitalMesh = createCapitalMarker(rebel, seat[0], seat[1]);
  scene.add(rebel.capitalMesh);
  for(const [cx, cz] of take) claimTile(rebel, cx, cz);
  n.stability = 0.5;
  declareWar(rebel, n, `The provinces of <b>${n.name}</b> have risen.`);
  noteHistory(n, 'Civil war — ' + rebel.name + ' broke away');
  fireEvent({
    kind: 'war', icon: '🔥', color: 0xd9584a, major: true,
    title: 'Rebellion! ' + rebel.name + ' breaks away',
    text: `${take.length} tiles secede from <b>${n.name}</b>.`,
    cx: seat[0], cz: seat[1]
  });
}

function triggerWorldEvent(){
  const active = nations.filter(n => !n.eliminated);
  const pool = WORLD_EVENTS.filter(e => active.length || e.id === 'wanderers');
  let total = 0; for(const e of pool) total += e.w;
  for(let attempt = 0; attempt < 6; attempt++){
    let r = Math.random() * total;
    let chosen = pool[0];
    for(const e of pool){ r -= e.w; if(r <= 0){ chosen = e; break; } }
    const n = active.length ? pick(active) : null;
    if(chosen.run(n)) return;
  }
}
