  { id:'uprising', name:'Stir Unrest', icon:'🔥', cost:28, color:0xc07a33,
    desc:'Drives a state toward rebellion and civil war.' }
];

function applyPower(power, cx, cz){
  const t = tiles[cz][cx];
  const owner = t.owner ? nationsById.get(t.owner) : null;
  switch(power.id){
    case 'settlers': {
      let added = 0;
      for(let i = 0; i < 4; i++){
        const cand = [[cx, cz]].concat(neighborsOf(cx, cz)).filter(([x, z]) => isLand(x, z));
        if(!cand.length) break;
        const [sx, sz] = pick(cand);
        if(spawnAgent(sx, sz, null)) added++;
      }
      if(!added) return 'There is no dry land here.';
      fireEvent({ kind:'divine', icon:'👣', color:power.color, title:'Settlers answer the call',
        text:`${added} wanderers arrive out of nowhere.`, cx, cz });
      return null;
    }
    case 'bless': {
      if(owner){
        owner.stock.food += 45; owner.stock.wood += 30; owner.stock.gold += 25;
        owner.stability = clamp(owner.stability + 0.3, 0, 1);
        spawnAgent(cx, cz, owner.id);
        noteHistory(owner, 'Blessed from above');
      }
      for(let i = 0; i < 3; i++) spawnGroundRing(cx, cz, 0xd7a13c, 1.2 + i * 0.5);
      fireEvent({ kind:'divine', icon:'🌟', color:power.color, title:'The land is blessed',
        text: owner ? `<b>${owner.name}</b> receives abundance.` : 'Wildflowers, for nobody in particular.',
        cx, cz, major:true });
      return null;
    }
    case 'raise': {
      reshapeTerrain(cx, cz, 0.16, 3);
      spawnGroundRing(cx, cz, 0x8d8a7e, 2.6);
      fireEvent({ kind:'divine', icon:'⛰️', color:power.color, title:'The earth rises',
        text:'Hills push up where there were none.', cx, cz, major:true });
      return null;
    }
    case 'sink': {
      reshapeTerrain(cx, cz, -0.16, 3);
      spawnGroundRing(cx, cz, 0x6fa8d6, 2.6);
      fireEvent({ kind:'divine', icon:'🌊', color:power.color, title:'The earth sinks',
        text:'The sea takes what it is given.', cx, cz, major:true });
      return null;
    }
    case 'meteor': {
      let razed = 0, killed = 0;
      for(let dz = -1; dz <= 1; dz++) for(let dx = -1; dx <= 1; dx++){
        const x = cx + dx, z = cz + dz;
        if(!inBounds(x, z)) continue;
        if(destroyBuilding(x, z)) razed++;
        for(const a of agents.slice()) if(a.cx === x && a.cz === z){ removeAgent(a); killed++; }
      }
      reshapeTerrain(cx, cz, -0.1, 2);
      for(let i = 0; i < 4; i++) spawnGroundRing(cx, cz, 0xff8a3d, 1.4 + i * 0.9);
      spawnFloatIcon(cx, cz, '☄️', 0xd9584a, 2.2);
      shake = 1.6;
      if(owner) owner.stability -= 0.2;
      fireEvent({ kind:'divine', icon:'☄️', color:power.color, major:true,
        title:'A meteor strikes',
        text:`${killed} dead, ${razed} building${razed === 1 ? '' : 's'} flattened.`, cx, cz, noMark:true });
      return null;
    }
    case 'plague': {
      if(!owner) return 'Nobody holds this ground.';
      const lost = killCitizens(owner, Math.max(1, Math.ceil(owner.pop * 0.4)));
      owner.stability -= 0.25;
      fireEvent({ kind:'divine', icon:'☠️', color:power.color, major:true,
        title:'Pestilence upon ' + owner.name,
        text:`${lost} taken in a matter of days.`, cx, cz });
      return null;
    }
    case 'peace': {
      if(!owner) return 'Nobody holds this ground.';
      if(!owner.wars.size) return owner.name + ' is already at peace.';
      for(const eid of Array.from(owner.wars.keys())) makePeace(owner, nationsById.get(eid));
      owner.stability = clamp(owner.stability + 0.15, 0, 1);
      fireEvent({ kind:'divine', icon:'🕊️', color:power.color, major:true,
        title:'Peace is imposed on ' + owner.name,
        text:'Every sword in the realm is put down at once.', cx, cz });
      return null;
    }
    case 'uprising': {
      if(!owner) return 'Nobody holds this ground.';
      owner.stability = 0.04;
      fireEvent({ kind:'divine', icon:'🔥', color:power.color, major:true,
        title:'Unrest sweeps ' + owner.name,
        text:'Grain hoarded, taxes resented, knives sharpened.', cx, cz });
      return null;
    }
  }
  return null;
}

/* ============================ THE TICK ============================ */
function tick(){
  day++;
  const seasonChanged = updateSeason();
  if(seasonChanged){
    fireEvent({ kind:'season', icon: season().icon, color: 0x8d8a7e, quiet: true, noMark: true,
      title: season().name + ' arrives',
      text: 'Day ' + day + ' — ' + season().note + '.' });
  }

  // population counts, once
  for(const n of nations) n.pop = 0;
  for(const a of agents){
    if(a.nationId){
      const n = nationsById.get(a.nationId);
      if(!n || n.eliminated){ a.nationId = null; a.mesh.material.color.set(0x9aa5b8); }
      else n.pop++;
    }
  }

  for(const a of agents){
    moveAgent(a);
    if(a.nationId === null && Math.random() < FOUND_CHANCE){
      const t = tiles[a.cz][a.cx];
      if(t.type === 'land' && !t.owner && nearestNationDistance(a.cx, a.cz) >= MIN_NATION_GAP) foundNation(a);
    }
  }

  for(const n of nations){
    if(n.eliminated) continue;
    economyTick(n);
    considerDiplomacy(n);
    considerRebellion(n);
    if(n.eliminated) continue;

    if(--n.cooldowns.expand <= 0){
      n.cooldowns.expand = Math.round((3 + Math.random() * 4) * n.trait.build);
      const target = pickExpansion(n);
      if(target){
        const t = tiles[target[1]][target[0]];
        if(!t.owner && n.stock.food > 4){ claimTile(n, target[0], target[1]); n.stock.food -= 2; }
      }
    }

    if(--n.cooldowns.grow <= 0){
      const g = options.seasons ? season().growth : 1;
      n.cooldowns.grow = Math.max(1, Math.round((4 + Math.random() * 4) / (n.trait.grow * g * ERAS[n.era].growth)));
      if(n.pop < n.popCap && agents.length < MAX_AGENTS && n.stock.food > 6 && n.tiles.size){
        const [cx, cz] = parseKey(pick(Array.from(n.tiles)));
        if(spawnAgent(cx, cz, n.id)){ n.pop++; n.stock.food -= 4; }
      }
    }

    if(--n.cooldowns.build <= 0){
      n.cooldowns.build = Math.max(2, Math.round((5 + Math.random() * 5) * n.trait.build));
      if(n.pop >= 2) chooseAndBuild(n);
    }

    if(--n.cooldowns.army <= 0){
      n.cooldowns.army = 6 + Math.floor(Math.random() * 8);
      if(n.wars.size) raiseArmy(n);
    }

    if(n.tiles.size > n.peak.tiles) n.peak.tiles = n.tiles.size;
    if(n.pop > n.peak.pop) n.peak.pop = n.pop;
  }

  for(const army of armies.slice()) stepArmy(army);

  if(--worldEventCooldown <= 0){
    worldEventCooldown = 24 + Math.floor(Math.random() * 22);
    triggerWorldEvent();
  }

  favour = Math.min(MAX_FAVOUR, favour + 0.55);

  if(day % 4 === 0) sampleHistory();
  if(terrainDirty){ updateTerrainColors(); terrainDirty = false; }
  refreshHUD();
  if(openPanel) renderPanel(openPanel, true);
  if(inspector.target) refreshInspector();
}

function pickExpansion(n){
  const cands = [];
  for(const k of n.tiles){
    const [cx, cz] = parseKey(k);
    for(const [nx, nz] of neighborsOf(cx, cz)){
      if(!isLand(nx, nz)) continue;
      const t = tiles[nz][nx];
      if(t.owner === n.id) continue;
      if(t.owner && !n.wars.has(t.owner)) continue;
      cands.push([nx, nz, t.owner ? 0.3 : (t.resource === 'farmland' ? 3 : t.resource === 'forest' ? 2 : 1)]);
    }
  }
  if(!cands.length) return null;
  let total = 0; for(const c of cands) total += c[2];
  let r = Math.random() * total;
  for(const c of cands){ r -= c[2]; if(r <= 0) return c; }
  return cands[0];
}

function sampleHistory(){
  const snap = { day, total: agents.length, per: {} };
  for(const n of nations) if(!n.eliminated) snap.per[n.id] = n.pop;
  historySamples.push(snap);
  if(historySamples.length > 220) historySamples.shift();
}

/* ============================ EVENT FEEDBACK ============================ */
const iconTextures = new Map();
function iconTexture(ch){
  if(iconTextures.has(ch)) return iconTextures.get(ch);
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.font = '88px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 12;
  g.fillText(ch, 64, 70);
  const tex = new THREE.CanvasTexture(c);
  iconTextures.set(ch, tex);
  return tex;
}

function spawnFloatIcon(cx, cz, ch, colorHex, scale){
  if(!inBounds(cx, cz)) return;
  const mat = new THREE.SpriteMaterial({ map: iconTexture(ch), transparent: true, depthTest: false, opacity: 0 });
  const sp = new THREE.Sprite(mat);
  sp.renderOrder = 999;
  const s = scale || 1;
  sp.position.set(cellX(cx), tiles[cz][cx].y + 0.5, cellZ(cz));
  sp.scale.setScalar(0.1);
  scene.add(sp);
  floatIcons.push({ sprite: sp, born: performance.now(), life: 2100 + s * 300, baseY: tiles[cz][cx].y + 0.5, size: 0.95 * s });

  // a soft halo so the icon reads against bright terrain
  const halo = new THREE.Mesh(
    new THREE.CircleGeometry(0.42 * s, 18),
    new THREE.MeshBasicMaterial({ color: colorHex || 0xffffff, transparent: true, opacity: 0.35, depthTest: false })
  );
  halo.renderOrder = 998;
  halo.rotation.x = -Math.PI / 2;
  halo.position.set(cellX(cx), tiles[cz][cx].y + 0.06, cellZ(cz));
  scene.add(halo);
  floatIcons.push({ sprite: halo, born: performance.now(), life: 1200, flat: true, baseY: tiles[cz][cx].y + 0.06, size: 1 * s });
}

/* Sprites share a module-level geometry inside three.js, so only the material
   (and a halo's own geometry) may ever be disposed here. */
function disposeFloat(f){
  scene.remove(f.sprite);
  if(f.sprite.material) f.sprite.material.dispose();
  if(f.flat && f.sprite.geometry) f.sprite.geometry.dispose();
}

function spawnGroundRing(cx, cz, colorHex, maxScale){
  if(!inBounds(cx, cz)) return;
  const geo = new THREE.RingGeometry(0.3, 0.42, 26);
  const mat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.95, side: THREE.DoubleSide, depthTest: false });
  const m = new THREE.Mesh(geo, mat);
  m.renderOrder = 997;
  m.rotation.x = -Math.PI / 2;
  m.position.set(cellX(cx), tiles[cz][cx].y + 0.05, cellZ(cz));
  scene.add(m);
  groundRings.push({ mesh: m, born: performance.now(), life: 1250, max: maxScale || 2.2 });
}

const KIND_META = {
  found:   { label: 'Founding' },
  war:     { label: 'War' },
  peace:   { label: 'Peace' },
  boon:    { label: 'Fortune' },
  disaster:{ label: 'Disaster' },
  tech:    { label: 'Discovery' },
  divine:  { label: 'Divine' },
  season:  { label: 'Season' }
};

function fireEvent(ev){
  const entry = {
    day, kind: ev.kind || 'boon', icon: ev.icon || '•',
    title: ev.title || '', text: ev.text || '',
    cx: ev.cx, cz: ev.cz
  };
  chronicle.unshift(entry);
  if(chronicle.length > 240) chronicle.pop();
  unreadEvents++;

  if(ev.cx !== undefined && ev.cz !== undefined){
    if(!ev.noMark){
      spawnFloatIcon(ev.cx, ev.cz, entry.icon, ev.color || 0xffffff, ev.major ? 1.5 : 1);
      spawnGroundRing(ev.cx, ev.cz, ev.color || 0xffffff, ev.major ? 3.2 : 2);
    }
    pings.push({ cx: ev.cx, cz: ev.cz, born: performance.now(), color: hexCss(ev.color || 0xffffff) });
    if(pings.length > 30) pings.shift();
  }
  if(ev.major){
    flashScreen(hexCss(ev.color || 0xd9584a));
    shake = Math.max(shake, 0.55);
  }
  if(options.toasts && !ev.quiet) pushToast(entry, hexCss(ev.color || 0xd7a13c));
  if(openPanel === 'chronicle') renderPanel('chronicle', true);
  updateBadge();
}

function hexCss(h){ return '#' + h.toString(16).padStart(6, '0'); }

const toastEl = () => document.getElementById('toasts');
let lastToast = { title: '', at: 0 };
function pushToast(entry, color){
  // the same headline twice in a row is noise, not news
  const now = performance.now();
  if(entry.title === lastToast.title && now - lastToast.at < 6000) return;
  lastToast = { title: entry.title, at: now };
  const wrap = toastEl();
  while(wrap.children.length >= 3) wrap.removeChild(wrap.firstChild);
  const el = document.createElement('div');
  el.className = 'toast plate';
  el.style.borderLeftColor = color;
  el.innerHTML =
    `<div class="ic" style="color:${color}">${entry.icon}</div>` +
    `<div><div class="tt">${entry.title}</div><div class="td">${entry.text}</div></div>`;
  wrap.appendChild(el);
  setTimeout(() => {
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 320);
  }, 4300);
}

function flashScreen(color){
  const f = document.getElementById('flash');
  f.style.color = color;
  f.classList.remove('go');
  void f.offsetWidth;
  f.classList.add('go');
}

let unreadEvents = 0;
function updateBadge(){
  const btn = document.querySelector('.dock-btn[data-panel="chronicle"]');
  if(!btn) return;
  let b = btn.querySelector('.badge');
  if(openPanel === 'chronicle') unreadEvents = 0;
  if(unreadEvents <= 0){ if(b) b.remove(); return; }
  if(!b){ b = document.createElement('span'); b.className = 'badge'; btn.appendChild(b); }
  b.textContent = unreadEvents > 99 ? '99+' : unreadEvents;
}

/* ============================ HUD ============================ */
function refreshHUD(){
  const active = nations.filter(n => !n.eliminated);
  let warPairs = 0;
  for(const n of active) warPairs += n.wars.size;
  document.getElementById('r-day').textContent = fmt(day);
  document.getElementById('r-nations').textContent = active.length;
  document.getElementById('r-pop').textContent = agents.length;
  document.getElementById('r-wars').textContent = warPairs / 2;

  let topEra = 0;
  for(const n of active) if(n.era > topEra) topEra = n.era;
  document.getElementById('hud-epoch').textContent = ERAS[topEra].name;

  const s = season();
  document.getElementById('season-orb').textContent = s.icon;
  document.getElementById('season-name').textContent = s.name;
  document.getElementById('season-detail').textContent =
    'year ' + (Math.floor(day / (DAYS_PER_SEASON * 4)) + 1) + ' · ' + clockWord();

  document.getElementById('energy-fill').style.width = (favour / MAX_FAVOUR * 100) + '%';
  document.getElementById('energy-val').textContent = Math.floor(favour) + ' / ' + MAX_FAVOUR;
}

let openPanel = null;
let chronFilter = 'all';
let panelTickCounter = 0;

const PANEL_TITLES = {
  nations:  ['States of the world', 'click a card to inspect'],
  chronicle:['The Annals', 'everything that has happened'],
  atlas:    ['Atlas', 'click the map to travel'],
  ledger:   ['Ledger', 'population and territory over time'],
  powers:   ['Divine powers', 'spend favour on the world'],
  settings: ['Rules of the world', ''],
  guide:    ['Guide', 'how this world works']
};

function setPanel(name){
  if(openPanel === name){ closeDrawer(); return; }
  openPanel = name;
  document.querySelectorAll('.dock-btn[data-panel]').forEach(b =>
    b.classList.toggle('on', b.dataset.panel === name));
  const d = document.getElementById('drawer');
  document.getElementById('drawer-title').textContent = PANEL_TITLES[name][0];
  document.getElementById('drawer-sub').textContent = PANEL_TITLES[name][1];
  d.classList.add('open');
  renderPanel(name);
  if(name === 'chronicle'){ unreadEvents = 0; updateBadge(); }
}
function closeDrawer(){
  openPanel = null;
  document.getElementById('drawer').classList.remove('open');
  document.querySelectorAll('.dock-btn[data-panel]').forEach(b => b.classList.remove('on'));
}

function renderPanel(name, isRefresh){
  if(isRefresh){
    if(++panelTickCounter % 3 !== 0 && name !== 'chronicle') return;
    if(name === 'settings' || name === 'guide' || name === 'powers') return;
  }
  const body = document.getElementById('drawer-body');
  const keepScroll = isRefresh ? body.scrollTop : 0;
  if(name === 'nations') body.innerHTML = renderNations();
  else if(name === 'chronicle') body.innerHTML = renderChronicle();
  else if(name === 'atlas') renderAtlas(body, isRefresh);
  else if(name === 'ledger') renderLedger(body, isRefresh);
  else if(name === 'powers') body.innerHTML = renderPowers();
  else if(name === 'settings') body.innerHTML = renderSettings();
  else if(name === 'guide') body.innerHTML = renderGuide();
  body.scrollTop = keepScroll;
}

function stabilityColor(v){
  if(v > 0.6) return 'var(--verdigris)';
  if(v > 0.32) return 'var(--brass)';
  return 'var(--ember)';
}

function renderNations(){
  const active = nations.filter(n => !n.eliminated).sort((a, b) => b.tiles.size - a.tiles.size);
  if(!active.length) return `<p class="empty">No states yet — settlers are still wandering. Give them time, or send more from the Powers panel.</p>`;
  return '<div class="nation-grid">' + active.map(n => {
    const hex = '#' + n.color.getHexString();
    const chips = [];
    if(n.wars.size) chips.push(`<span class="chip war">⚔️ ${n.wars.size} war${n.wars.size > 1 ? 's' : ''}</span>`);
    if(n.allies.size) chips.push(`<span class="chip ally">🤝 ${n.allies.size}</span>`);
    if(n.trades.size) chips.push(`<span class="chip trade">🏺 ${n.trades.size}</span>`);
    const arm = armiesOf(n).length;
    if(arm) chips.push(`<span class="chip war">🗡️ ${arm}</span>`);
    if(!chips.length) chips.push(`<span class="chip">at peace</span>`);
    return `<div class="nation-card" data-nation="${n.id}">
      <div class="nc-top">
        <span class="swatch" style="background:${hex}"></span>
        <span class="nc-name"><span class="n">${n.name}</span><span class="t">${n.trait.icon} ${n.trait.name} · ${ERAS[n.era].name}</span></span>
      </div>
      <div class="nc-stats">
        <div class="cell"><span class="v">${n.pop}</span><span class="k">Souls</span></div>
        <div class="cell"><span class="v">${n.tiles.size}</span><span class="k">Tiles</span></div>
        <div class="cell"><span class="v">${Math.round(n.stability * 100)}</span><span class="k">Stability</span></div>
      </div>
      <div class="meter"><i style="width:${Math.round(n.stability * 100)}%;background:${stabilityColor(n.stability)}"></i></div>
      <div class="chips">${chips.join('')}</div>
    </div>`;
  }).join('') + '</div>';
}

function renderChronicle(){
  const kinds = ['all', 'war', 'peace', 'found', 'disaster', 'boon', 'tech', 'divine'];
  const labels = { all:'Everything', war:'War', peace:'Peace', found:'Founding', disaster:'Disaster', boon:'Fortune', tech:'Discovery', divine:'Divine' };
  const filters = kinds.map(k =>
    `<button class="filter-btn ${chronFilter === k ? 'on' : ''}" data-chron="${k}">${labels[k]}</button>`).join('');
  const rows = chronicle.filter(e => chronFilter === 'all' || e.kind === chronFilter).slice(0, 90);
  const list = rows.length
    ? rows.map(e => `<div class="chron ${e.kind}"><span class="ic">${e.icon}</span><span class="d">DAY ${e.day}</span>
        <span class="txt"><b>${e.title}</b> — ${e.text}</span></div>`).join('')
    : `<p class="empty">Nothing of this kind has happened yet.</p>`;
  return `<div class="filter-row">${filters}</div><div id="chronicle-list">${list}</div>`;
}

function renderAtlas(body, isRefresh){
  if(!isRefresh || !document.getElementById('minimap')){
    body.innerHTML = `<div class="map-wrap">
      <canvas id="minimap" width="480" height="480"></canvas>
      <div>
        <div class="terrain-key">
          <div class="key-row"><span class="key-dot" style="background:#1d4a68"></span> Water — impassable</div>
          <div class="key-row"><span class="key-dot" style="background:#3c6b39"></span> Open land — settle and farm here</div>
          <div class="key-row"><span class="key-dot" style="background:#2f5730"></span> Woodland — timber for building</div>
          <div class="key-row"><span class="key-dot" style="background:#7d9440"></span> Farmland — the best food</div>
          <div class="key-row"><span class="key-dot" style="background:#857f78"></span> Mountain — ore, and easy to defend</div>
          <div class="key-row"><span class="key-dot" style="background:#ece2ce"></span> Flag — a capital</div>
          <div class="key-row"><span class="key-dot" style="background:#d9584a"></span> Pulse — something just happened there</div>
        </div>
        <p class="empty" style="margin-top:14px">Every coloured region is one state's claim. Click anywhere on the map to swing the camera over it.</p>
      </div>
    </div>`;
    const mm = document.getElementById('minimap');
    mm.addEventListener('click', (e) => {
      const r = mm.getBoundingClientRect();
      const cx = clamp(Math.floor((e.clientX - r.left) / r.width * GRID), 0, GRID - 1);
      const cz = clamp(Math.floor((e.clientY - r.top) / r.height * GRID), 0, GRID - 1);
      focusOn(cx, cz);
      showTileInspector(cx, cz);
    });
  }
  drawMinimap();
}

function drawMinimap(){
  const mm = document.getElementById('minimap');
  if(!mm || !tiles) return;
  const g = mm.getContext('2d');
  const w = mm.width, s = w / GRID;
  g.fillStyle = '#06090e'; g.fillRect(0, 0, w, w);
  for(let cz = 0; cz < GRID; cz++){
    for(let cx = 0; cx < GRID; cx++){
      const t = tiles[cz][cx];
      let col;
      if(t.type === 'water') col = '#153348';
      else if(t.owner){ const n = nationsById.get(t.owner); col = n ? '#' + n.color.getHexString() : '#3c6b39'; }
      else if(t.type === 'mountain') col = '#7d7871';
      else if(t.resource === 'forest') col = '#2f5730';
      else if(t.resource === 'farmland') col = '#6b813a';
      else col = '#3c6b39';
      g.fillStyle = col;
      g.fillRect(cx * s, cz * s, s + 0.7, s + 0.7);
    }
  }
  if(options.buildings){
    g.fillStyle = 'rgba(0,0,0,0.35)';
    for(let cz = 0; cz < GRID; cz++) for(let cx = 0; cx < GRID; cx++)
      if(tiles[cz][cx].building) g.fillRect(cx * s + s * 0.3, cz * s + s * 0.3, s * 0.4, s * 0.4);
  }
  for(const n of nations){
    if(n.eliminated) continue;
    g.fillStyle = '#ece2ce';
    g.beginPath();
    g.arc((n.capital.cx + 0.5) * s, (n.capital.cz + 0.5) * s, s * 0.55, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = '#' + n.color.getHexString();
    g.beginPath();
    g.arc((n.capital.cx + 0.5) * s, (n.capital.cz + 0.5) * s, s * 0.3, 0, Math.PI * 2);
    g.fill();
  }
  if(options.armies){
    for(const a of armies){
      const n = nationsById.get(a.nationId);
      g.strokeStyle = n ? '#' + n.color.getHexString() : '#fff';
      g.lineWidth = 1.6;
      g.strokeRect((a.cx + 0.1) * s, (a.cz + 0.1) * s, s * 0.8, s * 0.8);
    }
  }
  const now = performance.now();
  for(const p of pings){
    const t = (now - p.born) / 2400;
    if(t > 1) continue;
    g.strokeStyle = p.color;
    g.globalAlpha = 1 - t;
    g.lineWidth = 2;
    g.beginPath();
    g.arc((p.cx + 0.5) * s, (p.cz + 0.5) * s, s * (1 + t * 6), 0, Math.PI * 2);
    g.stroke();
    g.globalAlpha = 1;
  }
}

function fitCanvas(c, cssHeight){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = c.clientWidth || 600;
  c.width = Math.round(w * dpr);
  c.height = Math.round(cssHeight * dpr);
  c.style.height = cssHeight + 'px';
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { g, w, h: cssHeight };
}

const INK_MUTED = '#8d8a7e', INK_TEXT = '#ece2ce', GRIDLINE = 'rgba(226,214,190,0.10)';
let popHover = null;
let popChartGeom = null;

function topNations(k){
  return nations.filter(n => !n.eliminated).sort((a, b) => b.pop - a.pop).slice(0, k);
}

function drawPopChart(){
  const c = document.getElementById('pop-chart');
  if(!c) return;
  const { g, w, h } = fitCanvas(c, 220);
  g.clearRect(0, 0, w, h);
  const padL = 44, padR = 16, padT = 12, padB = 26;
  const plotW = w - padL - padR, plotH = h - padT - padB;

  if(historySamples.length < 2){
    g.fillStyle = INK_MUTED;
    g.font = '12px "Karla", sans-serif';
    g.fillText('The record begins after a few days have passed.', padL, padT + 20);
    return;
  }

  const series = topNations(6);
  const d0 = historySamples[0].day, d1 = historySamples[historySamples.length - 1].day || 1;
  let maxV = 4;
  for(const s of historySamples){
    if(s.total > maxV) maxV = s.total;
  }
  maxV = Math.ceil(maxV / 10) * 10;

  const X = d => padL + ((d - d0) / Math.max(1, d1 - d0)) * plotW;
  const Y = v => padT + plotH - (v / maxV) * plotH;

  // grid + axis labels (every label names a value the chart reaches)
  g.font = '10px "IBM Plex Mono", monospace';
  g.textBaseline = 'middle';
  for(let i = 0; i <= 4; i++){
    const v = maxV * i / 4, y = Y(v);
    g.strokeStyle = GRIDLINE; g.lineWidth = 1;
    g.beginPath(); g.moveTo(padL, y + 0.5); g.lineTo(w - padR, y + 0.5); g.stroke();
    g.fillStyle = INK_MUTED; g.textAlign = 'right';
    g.fillText(String(Math.round(v)), padL - 8, y);
  }
  g.textBaseline = 'top';
  for(let i = 0; i <= 3; i++){
    const d = Math.round(d0 + (d1 - d0) * i / 3);
    g.fillStyle = INK_MUTED;
    g.textAlign = i === 0 ? 'left' : (i === 3 ? 'right' : 'center');
    g.fillText('day ' + d, X(d), h - padB + 7);
  }

  // total population as a recessive area behind the series
  g.beginPath();
  g.moveTo(X(d0), Y(0));
  for(const s of historySamples) g.lineTo(X(s.day), Y(s.total));
  g.lineTo(X(d1), Y(0));
  g.closePath();
  g.fillStyle = 'rgba(226,214,190,0.07)';
  g.fill();

  // one line per state, coloured by the state itself
  g.lineJoin = 'round'; g.lineCap = 'round';
  for(const n of series){
    g.beginPath();
    let started = false;
    for(const s of historySamples){
      const v = s.per[n.id];
      if(v === undefined){ started = false; continue; }
      const x = X(s.day), y = Y(v);
      if(!started){ g.moveTo(x, y); started = true; } else g.lineTo(x, y);
    }
    g.strokeStyle = '#' + n.color.getHexString();
    g.lineWidth = 2;
    g.stroke();
    const last = historySamples[historySamples.length - 1];
    if(last.per[n.id] !== undefined){
      g.beginPath();
      g.arc(X(last.day), Y(last.per[n.id]), 3.2, 0, Math.PI * 2);
      g.fillStyle = '#' + n.color.getHexString();
      g.fill();
      g.strokeStyle = '#0f151e'; g.lineWidth = 2; g.stroke();
    }
  }

  popChartGeom = { padL, padR, padT, padB, plotW, plotH, d0, d1, maxV, X, Y, series };

  if(popHover){
    const s = popHover;
    const x = X(s.day);
    g.strokeStyle = 'rgba(226,214,190,0.35)';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(x + 0.5, padT); g.lineTo(x + 0.5, padT + plotH); g.stroke();
    const lines = [['Day ' + s.day, INK_TEXT], ['' + s.total + ' alive in all', INK_MUTED]];
    for(const n of series) if(s.per[n.id] !== undefined) lines.push([n.name + '  ' + s.per[n.id], '#' + n.color.getHexString()]);
    const bw = 148, bh = 14 + lines.length * 14;
    const bx = Math.min(x + 10, w - padR - bw), by = padT + 6;
    g.fillStyle = 'rgba(10,15,22,0.94)';
    g.strokeStyle = 'rgba(226,214,190,0.18)';
    g.lineWidth = 1;
    g.beginPath();
    if(g.roundRect) g.roundRect(bx, by, bw, bh, 7); else g.rect(bx, by, bw, bh);
    g.fill(); g.stroke();
    g.textAlign = 'left'; g.textBaseline = 'middle';
    lines.forEach((ln, i) => {
      g.fillStyle = ln[1];
      g.font = (i === 0 ? '600 11px' : '11px') + ' "IBM Plex Mono", monospace';
      g.fillText(ln[0], bx + 9, by + 14 + i * 14);
    });
  }

  const legend = document.getElementById('pop-legend');
  if(legend){
    legend.innerHTML = series.length
      ? series.map(n => `<span class="li"><i style="background:#${n.color.getHexString()}"></i>${n.name} <span class="num" style="color:var(--muted)">${n.pop}</span></span>`).join('')
        + `<span class="li"><i style="background:rgba(226,214,190,0.3)"></i>All souls <span class="num" style="color:var(--muted)">${agents.length}</span></span>`
      : '<span class="li" style="color:var(--muted)">No states to chart yet.</span>';
  }
}

function onPopHover(e){
  if(!popChartGeom || !historySamples.length) return;
  const c = e.currentTarget;
  const r = c.getBoundingClientRect();
  const x = e.clientX - r.left;
  const { padL, plotW, d0, d1 } = popChartGeom;
  const dTarget = d0 + clamp((x - padL) / plotW, 0, 1) * (d1 - d0);
  let best = historySamples[0], bestD = Infinity;
  for(const s of historySamples){ const d = Math.abs(s.day - dTarget); if(d < bestD){ bestD = d; best = s; } }
  popHover = best;
  drawPopChart();
}

function drawTerritoryChart(){
  const c = document.getElementById('terr-chart');
  if(!c) return;
  const list = nations.filter(n => !n.eliminated).sort((a, b) => b.tiles.size - a.tiles.size).slice(0, 8);
  const rowH = 26;
  const { g, w, h } = fitCanvas(c, Math.max(60, list.length * rowH + 16));
  g.clearRect(0, 0, w, h);
  if(!list.length){
    g.fillStyle = INK_MUTED; g.font = '12px "Karla", sans-serif';
    g.fillText('No claims have been staked yet.', 4, 22);
    return;
  }
  const labelW = Math.min(150, w * 0.32);
  const valW = 40;
  const barMax = w - labelW - valW - 10;
  const maxT = Math.max(...list.map(n => n.tiles.size), 1);
  g.textBaseline = 'middle';
  list.forEach((n, i) => {
    const y = 8 + i * rowH;
    g.fillStyle = INK_TEXT;
    g.font = '12px "Karla", sans-serif';
    g.textAlign = 'left';
    let name = n.name;
    while(g.measureText(name).width > labelW - 10 && name.length > 4) name = name.slice(0, -2);
    g.fillText(name === n.name ? name : name + '…', 0, y + rowH / 2 - 3);
    const bw = Math.max(4, (n.tiles.size / maxT) * barMax);
    g.fillStyle = '#' + n.color.getHexString();
    g.beginPath();
    if(g.roundRect) g.roundRect(labelW, y + 4, bw, rowH - 14, [2, 4, 4, 2]);
    else g.rect(labelW, y + 4, bw, rowH - 14);
    g.fill();
    g.fillStyle = INK_MUTED;
    g.font = '11px "IBM Plex Mono", monospace';
    g.textAlign = 'left';
    g.fillText(String(n.tiles.size), labelW + bw + 8, y + rowH / 2 - 3);
  });
}

const inspector = { target: null };

function showTileInspector(cx, cz){
  inspector.target = { kind: 'tile', cx, cz };

}
function showNationInspector(id){
  const n = nationsById.get(id);

  inspector.target = { kind: 'nation', id };
  refreshInspector();

function hideInspector(){
  inspector.target = null;
  document.getElementById('inspector').classList.remove('show');
}

function row(k, v){ return `<div class="irow"><span class="k">${k}</span><span class="v">${v}</span></div>`; }

function refreshInspector(){
  const el = document.getElementById('inspector');
  const t = inspector.target;
  if(!t){ el.classList.remove('show'); return; }
  el.classList.add('show');
  const rows = document.getElementById('insp-rows');
  const stocks = document.getElementById('insp-stocks');
  const note = document.getElementById('insp-note');
  const focusBtn = document.getElementById('insp-focus');
  focusBtn.style.display = 'block';

  if(t.kind === 'tile'){
    const tile = tiles[t.cz][t.cx];
    const owner = tile.owner ? nationsById.get(tile.owner) : null;
    document.getElementById('insp-swatch').style.background = owner ? '#' + owner.color.getHexString() : 'var(--muted)';
    document.getElementById('insp-title').textContent = `Tile ${t.cx}, ${t.cz}`;
    document.getElementById('insp-sub').textContent = tile.type === 'water' ? 'Open water' : tile.type === 'mountain' ? 'High ground' : 'Lowland';
    rows.innerHTML =
      row('Ground', tile.type[0].toUpperCase() + tile.type.slice(1)) +
      row('Yields', tile.resource ? RESOURCE_LABEL[tile.resource] : '—') +
      row('Elevation', (tile.hRaw * 100).toFixed(0) + ' m') +
      row('Held by', owner ? `<a href="#" data-nation-link="${owner.id}" style="color:#${owner.color.getHexString()};text-decoration:none;border-bottom:1px dotted">${owner.name}</a>` : 'Nobody') +
      row('Building', tile.building ? BUILDINGS[tile.building].icon + ' ' + BUILDINGS[tile.building].name : 'None') +
      row('People here', agents.filter(a => a.cx === t.cx && a.cz === t.cz).length);
    stocks.style.display = 'none';
    note.textContent = tile.building ? BUILDINGS[tile.building].desc : '';
  } else {
    const n = nationsById.get(t.id);
    if(!n || n.eliminated){ hideInspector(); return; }
    document.getElementById('insp-swatch').style.background = '#' + n.color.getHexString();
    document.getElementById('insp-title').textContent = n.name;
    document.getElementById('insp-sub').textContent = `${n.trait.icon} ${n.trait.name} · ${ERAS[n.era].name}`;
    const warNames = Array.from(n.wars.keys()).map(id => (nationsById.get(id) || {}).name || '?');
    const allyNames = Array.from(n.allies).map(id => (nationsById.get(id) || {}).name || '?');
    const tradeNames = Array.from(n.trades).map(id => (nationsById.get(id) || {}).name || '?');
    const nextEra = ERAS[n.era + 1];
    rows.innerHTML =
      row('Founded', 'day ' + n.founded + ' · age ' + (day - n.founded)) +
      row('Territory', n.tiles.size + ' tiles') +
      row('Population', n.pop + ' / ' + n.popCap) +
      row('Food balance', (n.foodFlow >= 0 ? '+' : '') + (n.foodFlow || 0).toFixed(1) + ' a day') +
      row('Stability', `<span style="color:${stabilityColor(n.stability)}">${Math.round(n.stability * 100)}%</span>`) +
      row('Knowledge', Math.round(n.science) + (nextEra ? ' / ' + nextEra.science : '')) +
      row('Armies', armiesOf(n).length) +
      row('At war with', warNames.length ? warNames.join(', ') : 'nobody') +
      row('Allies', allyNames.length ? allyNames.join(', ') : 'none') +
      row('Trade with', tradeNames.length ? tradeNames.join(', ') : 'none');
    stocks.style.display = 'grid';
    stocks.innerHTML =
      `<div class="stock"><div class="i">🌾</div><span class="v">${Math.round(n.stock.food)}</span></div>` +
      `<div class="stock"><div class="i">🪵</div><span class="v">${Math.round(n.stock.wood)}</span></div>` +
      `<div class="stock"><div class="i">⛏️</div><span class="v">${Math.round(n.stock.ore)}</span></div>` +
      `<div class="stock"><div class="i">💰</div><span class="v">${Math.round(n.stock.gold)}</span></div>` +
      `<div class="stock"><div class="i">📚</div><span class="v">${Math.round(n.science)}</span></div>`;
    note.innerHTML = n.log.length
      ? n.log.slice(0, 3).map(l => `day ${l.day} — ${l.text}`).join('<br>')
      : n.trait.desc;
  }
}

function focusOn(cx, cz){
  const tx = cellX(cx), tz = cellZ(cz), ty = tiles[cz][cx].y + 0.8;
  const from = cam.target.clone();
  const start = performance.now();
  (function step(){
    const k = Math.min(1, (performance.now() - start) / 620);
    const e = 1 - Math.pow(1 - k, 3);
    cam.target.set(from.x + (tx - from.x) * e, from.y + (ty - from.y) * e, from.z + (tz - from.z) * e);
    updateCamera();
    if(k < 1) requestAnimationFrame(step);
  })();
}

/* ============================ WORLD CLICK ============================ */
function handleWorldClick(e){
  const cell = cellFromEvent(e);
  if(!cell) return;
  if(armedPower){
    const p = armedPower;
    if(favour < p.cost){ disarmPower(); return; }
    favour -= p.cost;
    const problem = applyPower(p, cell.cx, cell.cz);
    if(problem){
      favour += p.cost;
      pushToast({ icon: '✋', title: 'Nothing happens', text: problem }, '#8d8a7e');
    }
    disarmPower();
    refreshHUD();
    if(openPanel === 'powers') renderPanel('powers');
    return;
  }
  showTileInspector(cell.cx, cell.cz);
}

function armPower(id){
  const p = POWERS.find(x => x.id === id);
  if(!p || favour < p.cost) return;
  armedPower = p;
  document.getElementById('armed-ic').textContent = p.icon;
  document.getElementById('armed-tx').innerHTML = `<b>${p.name}</b> armed — click the world`;
  document.getElementById('armed').classList.add('show');
  document.getElementById('stage').classList.add('armed');
  document.getElementById('hint').style.opacity = '0';
  // get the panel out of the way so the whole world is clickable
  if(openPanel === 'powers') closeDrawer();
}
function disarmPower(){
  armedPower = null;
  document.getElementById('armed').classList.remove('show');
  document.getElementById('stage').classList.remove('armed');
  if(openPanel === 'powers') renderPanel('powers');
}

function setSpeed(v){

  paused = !paused;

function setupControls(){
  document.querySelectorAll('.dock-btn[data-panel]').forEach(b =>
    b.addEventListener('click', () => setPanel(b.dataset.panel)));
  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  document.getElementById('play-btn').addEventListener('click', togglePause);
  document.querySelectorAll('.speed-btn').forEach(b =>
    b.addEventListener('click', () => setSpeed(+b.dataset.speed)));
  document.getElementById('new-world').addEventListener('click', resetWorld);
  document.getElementById('insp-close').addEventListener('click', hideInspector);
  document.getElementById('insp-focus').addEventListener('click', () => {
    const t = inspector.target;
    if(!t) return;
    if(t.kind === 'tile') focusOn(t.cx, t.cz);
    else { const n = nationsById.get(t.id); if(n) focusOn(n.capital.cx, n.capital.cz); }
  });

  document.getElementById('drawer-body').addEventListener('click', (e) => {
    const card = e.target.closest('.nation-card');
    if(card){ const n = nationsById.get(+card.dataset.nation); showNationInspector(+card.dataset.nation); if(n) focusOn(n.capital.cx, n.capital.cz); return; }
    const chron = e.target.closest('[data-chron]');
    if(chron){ chronFilter = chron.dataset.chron; renderPanel('chronicle'); return; }
    const chronRow = e.target.closest('.chron');
    if(chronRow){
      const idx = Array.from(chronRow.parentNode.children).indexOf(chronRow);
      const rows = chronicle.filter(x => chronFilter === 'all' || x.kind === chronFilter);
      const ev = rows[idx];
      if(ev && ev.cx !== undefined){ focusOn(ev.cx, ev.cz); spawnGroundRing(ev.cx, ev.cz, 0xd7a13c, 2.4); }
      return;
    }
    const pw = e.target.closest('[data-power]');
    if(pw){ if(armedPower && armedPower.id === pw.dataset.power) disarmPower(); else armPower(pw.dataset.power); return; }
    const opt = e.target.closest('[data-opt]');
    if(opt){
      const k = opt.dataset.opt;
      options[k] = !options[k];
      opt.classList.toggle('on', options[k]);
      opt.setAttribute('aria-checked', String(options[k]));
      applyOptions();
      return;
    }
  });

  document.getElementById('inspector').addEventListener('click', (e) => {
    const link = e.target.closest('[data-nation-link]');
    if(link){ e.preventDefault(); showNationInspector(+link.dataset.nationLink); }
  });

  window.addEventListener('keydown', (e) => {
    if(e.target.tagName === 'INPUT') return;
    if(e.code === 'Space'){ e.preventDefault(); togglePause(); }
    else if(e.key === 'Escape'){ if(armedPower) disarmPower(); else if(openPanel) closeDrawer(); else hideInspector(); }
    else if(e.key >= '1' && e.key <= '6'){ setSpeed([0.25, 0.5, 1, 2, 4, 8][+e.key - 1]); }
  });
}

function applyOptions(){
  for(const t of decorMeshes) t.visible = options.decor && tiles[t.userData.cz][t.userData.cx].type !== 'water';
  for(let cz = 0; cz < GRID; cz++) for(let cx = 0; cx < GRID; cx++){
    const m = tiles[cz][cx].buildingMesh;
    if(m) m.visible = options.buildings;
  }
  for(const a of armies) a.mesh.visible = options.armies;
  terrainDirty = true;
}

/* ============================ RESET ============================ */
function resetWorld(){
  for(const a of agents.slice()) removeAgent(a);
  agents = [];
  for(const a of armies.slice()) destroyArmy(a);
  armies = [];
  if(tiles) for(const rowT of tiles) for(const t of rowT){ if(t.buildingMesh) disposeObj(t.buildingMesh); t.buildingMesh = null; t.building = null; }
  for(const n of nations) disposeObj(n.capitalMesh);
  for(const r of groundRings) disposeObj(r.mesh);
  groundRings.length = 0;
  for(const f of floatIcons) disposeFloat(f);
  floatIcons.length = 0;
  pings.length = 0;
  spinners.length = 0;
  nations = []; nationsById = new Map(); usedNames = new Set();
  nextNationId = 1; nextAgentId = 1; nextArmyId = 1;
  buildingCount = 0; day = 0; seasonIndex = 0; favour = MAX_FAVOUR;
  seasonColor = new THREE.Color(SEASONS[0].tint);
  worldEventCooldown = 26 + Math.floor(Math.random() * 18);
  chronicle.length = 0; historySamples.length = 0; unreadEvents = 0;
  hideInspector(); disarmPower(); updateBadge();
  toastEl().innerHTML = '';

  generateWorldData();
  buildTerrainMesh();
  buildDecorations();
  seedAgents();
  refreshHUD();
  if(openPanel) renderPanel(openPanel);
  fireEvent({ kind:'found', icon:'🌍', color:0x4fb9a1, quiet:false, noMark:true,
    title:'A new world', text:'Settlers step onto empty ground. Nothing has happened here yet.' });
}

function seedAgents(){
  for(let i = 0; i < 42; i++){
    const c = randomLandCell();
    spawnAgent(c.cx, c.cz, null);
  }
}

/* ============================ ANIMATION ============================ */
function animate(now){
  requestAnimationFrame(animate);
  const dt = Math.min(80, now - lastFrameTime);
  lastFrameTime = now;
  const t = now / 1000;

  if(!paused){
    tickAccum += dt * speedMult;
    if(tickAccum >= BASE_TICK_MS){
      tickAccum -= BASE_TICK_MS;
      if(tickAccum > BASE_TICK_MS * 3) tickAccum = 0;
      tick();
    }
    tickProgress = clamp(tickAccum / BASE_TICK_MS, 0, 1);
  }

  for(const a of agents){
    const p = tickProgress;
    a.mesh.position.set(
      a.prevX + (a.nextX - a.prevX) * p,
      a.prevY + (a.nextY - a.prevY) * p + 0.22 + Math.sin(t * 5 + a.bob) * 0.012,
      a.prevZ + (a.nextZ - a.prevZ) * p
    );
  }
  for(const a of armies){
    const p = tickProgress;
    a.mesh.position.set(
      a.prevX + (a.nextX - a.prevX) * p,
      a.prevY + (a.nextY - a.prevY) * p,
      a.prevZ + (a.nextZ - a.prevZ) * p
    );
  }

  for(const n of nations){
    if(n.eliminated || !n.capitalMesh) continue;
    const flag = n.capitalMesh.userData.flag;
    if(flag) flag.rotation.y = Math.sin(t * 2.2 + n.id) * 0.32;
    if(n.wars.size) n.capitalMesh.position.y = tiles[n.capital.cz][n.capital.cx].y + Math.abs(Math.sin(t * 4)) * 0.05;
  }

  for(let i = spinners.length - 1; i >= 0; i--){
    const s = spinners[i];
    if(!s.parent){ spinners.splice(i, 1); continue; }
    s.rotation.z += dt * 0.0011;
  }

  for(let i = groundRings.length - 1; i >= 0; i--){
    const r = groundRings[i];
    const k = (now - r.born) / r.life;
    if(k >= 1){ disposeObj(r.mesh); groundRings.splice(i, 1); continue; }
    r.mesh.material.opacity = 0.95 * (1 - k) * (1 - k);
    r.mesh.scale.setScalar(0.5 + k * r.max);
  }

  for(let i = floatIcons.length - 1; i >= 0; i--){
    const f = floatIcons[i];
    const k = (now - f.born) / f.life;
    if(k >= 1){ disposeFloat(f); floatIcons.splice(i, 1); continue; }
    if(f.flat){
      f.sprite.material.opacity = 0.4 * (1 - k);
      f.sprite.scale.setScalar(1 + k * 1.6);
    } else {
      const pop = k < 0.16 ? (k / 0.16) : 1;
      const overshoot = k < 0.16 ? 1 + (1 - k / 0.16) * 0.45 : 1;
      f.sprite.material.opacity = k > 0.72 ? (1 - k) / 0.28 : pop;
      f.sprite.scale.setScalar(f.size * pop * overshoot);
      f.sprite.position.y = f.baseY + 0.35 + k * 1.5;
    }
  }

  if(shake > 0.002){ shake *= 0.9; updateCamera(); }
  else if(shake) { shake = 0; updateCamera(); }
  if(options.autoOrbit && !dragging){ cam.azimuth += dt * 0.00006; updateCamera(); }

  updateAtmosphere(t);
  animateWater(t);
  if(openPanel === 'atlas') drawMinimap();

  renderer.render(scene, camera);
}

/* ============================ BOOT ============================ */
function boot(){
  initThree();
  setupControls();
  seasonColor = new THREE.Color(SEASONS[0].tint);
  generateWorldData();
  buildTerrainMesh();
  buildDecorations();
  seedAgents();
  refreshHUD();
  setTimeout(() => {
    const h = document.getElementById('hint');
    if(h) h.style.opacity = '0';
  }, 9000);
  requestAnimationFrame(animate);
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
